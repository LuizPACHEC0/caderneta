<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Caderneta — Controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>try{var t=localStorage.getItem('caderneta:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* ============================================================
   Caderneta — sistema de design
   Uma família tipográfica (Figtree). Cor por entidade:
   Ganhos = azul · Gastos = laranja · Investido = verde-água.
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --surface-2: #F6F7F9;
  --surface-3: #ECEFF3;
  --ink: #141A22;
  --ink-2: #4B5563;
  --ink-3: #6B7280;
  --ink-4: #B8BFCA;
  --line: #E4E7EC;
  --line-strong: #CFD5DD;
  --grid: #E8EBF0;
  --axis: #CBD1DA;
  --accent: #256ABF;
  --accent-hover: #1C5CAB;
  --accent-soft: #E7F0FB;
  --accent-ink: #256ABF;
  --on-accent: #FFFFFF;
  --c-ganhos: #2a78d6;
  --c-gastos: #eb6834;
  --c-invest: #1baf7a;
  --track: #E4EDF9;
  --good: #0ca30c;
  --good-text: #006300;
  --bad-text: #B72F2F;
  --warn-text: #8A5A00;
  --shadow-pop: 0 16px 40px rgba(20, 26, 34, .16);
  --scrim: rgba(12, 17, 24, .42);

  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-panel: 18px;
  --r-ctl: 10px;
  --rail-w: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0D1015;
    --surface: #161A21;
    --surface-2: #1B2028;
    --surface-3: #232A35;
    --ink: #EEF1F5;
    --ink-2: #B7BFCB;
    --ink-3: #8E97A5;
    --ink-4: #4A5362;
    --line: #252B35;
    --line-strong: #343C49;
    --grid: #222831;
    --axis: #343C49;
    --accent: #3987E5;
    --accent-hover: #5598E7;
    --accent-soft: #16253B;
    --accent-ink: #5598E7;
    --on-accent: #08111F;
    --c-ganhos: #3987e5;
    --c-gastos: #d95926;
    --c-invest: #199e70;
    --track: #1E2C44;
    --good: #0ca30c;
    --good-text: #2FC12F;
    --bad-text: #F08585;
    --warn-text: #F2B84B;
    --shadow-pop: 0 16px 40px rgba(0, 0, 0, .55);
    --scrim: rgba(3, 5, 8, .62);

  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0D1015;
    --surface: #161A21;
    --surface-2: #1B2028;
    --surface-3: #232A35;
    --ink: #EEF1F5;
    --ink-2: #B7BFCB;
    --ink-3: #8E97A5;
    --ink-4: #4A5362;
    --line: #252B35;
    --line-strong: #343C49;
    --grid: #222831;
    --axis: #343C49;
    --accent: #3987E5;
    --accent-hover: #5598E7;
    --accent-soft: #16253B;
    --accent-ink: #5598E7;
    --on-accent: #08111F;
    --c-ganhos: #3987e5;
    --c-gastos: #d95926;
    --c-invest: #199e70;
    --track: #1E2C44;
    --good: #0ca30c;
    --good-text: #2FC12F;
    --bad-text: #F08585;
    --warn-text: #F2B84B;
    --shadow-pop: 0 16px 40px rgba(0, 0, 0, .55);
    --scrim: rgba(3, 5, 8, .62);

}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body.no-scroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { flex: none; vertical-align: middle; }
.grow { flex: 1; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estrutura ---------- */
.rail {
  position: fixed; inset: 0 auto 0 0; width: var(--rail-w); z-index: 30;
  display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 16px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.main { margin-left: var(--rail-w); min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20; padding: 20px 32px 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(10px); backdrop-filter: saturate(1.3) blur(10px);
}
.topbar-inner, .view { max-width: 1240px; margin: 0 auto; }
.view { padding: 12px 32px 64px; outline: none; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* ---------- Marca e navegação ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
.brand-name { font-size: 19px; font-weight: 750; letter-spacing: -.02em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
  border: 0; border-radius: var(--r-ctl); background: none; color: var(--ink-2);
  font-weight: 600; text-align: left; transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.rail-user {
  margin-top: auto; display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 6px 8px;
  padding: 14px 4px 0; border-top: 1px solid var(--line);
}
.who-mail { max-width: 100%; }
.rail-user .who { grid-column: 2 / -1; }
.rail-user .icon-btn { grid-row: 2; }
.rail-user .icon-btn:nth-of-type(1) { grid-column: 1 / 3; justify-self: start; }
.rail-user .icon-btn:nth-of-type(2) { grid-column: 3 / 5; justify-self: end; }
.save-status { white-space: nowrap; }
.l-short { display: none; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 700; color: var(--ink-2); flex: none; }
.who { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.who-mail { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-status { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.save-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.save-status.saving::before { background: var(--c-gastos); }
.save-status.error { color: var(--bad-text); font-weight: 600; }
.save-status.error::before { background: var(--bad-text); }

/* ---------- Botões e controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong);
  background: var(--surface); font-weight: 650; font-size: 14px; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad-text); border-color: color-mix(in srgb, var(--bad-text) 40%, var(--line)); }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
  border: 0; background: transparent; color: var(--ink-3); transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn.round { border-radius: 50%; }
.icon-btn.sm { width: 30px; height: 30px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface-3); }
.seg button, .seg label span {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent;
  font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"], .seg input:checked + span {
  background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
}
.seg label { display: contents; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg.full { display: flex; } .seg.full > label, .seg.full > button { flex: 1; }
.seg.full label { display: block; flex: 1; } .seg.full label span { width: 100%; }

/* ---------- Seletor de período (o título da página) ---------- */
.period { display: flex; align-items: center; gap: 4px; min-width: 0; }
.period-title { font-size: clamp(24px, 3.4vw, 32px); font-weight: 750; letter-spacing: -.03em; line-height: 1.1; padding: 0 6px; white-space: nowrap; }
.page-title { font-size: clamp(24px, 3.4vw, 32px); font-weight: 750; letter-spacing: -.03em; }
.period-filters { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  position: relative; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid transparent;
  background: transparent; font-size: 13.5px; font-weight: 600; color: var(--ink-2); flex: none;
}
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip.now::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--c-gastos); }
.range-inputs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.field-inline, .search input, .toolbar select, .field input, .field select, .field textarea, .money input {
  height: 40px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); width: 100%;
}
.range-inputs input { width: auto; height: 36px; padding: 0 10px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); }

.quick { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 200px; padding: 6px; z-index: 40;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-pop);
}
.menu[hidden] { display: none; }
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 9px;
  background: none; text-align: left; font-weight: 600;
}
.menu button:hover { background: var(--surface-2); }

/* ---------- Painéis ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 22px; min-width: 0; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.panel-head h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.panel-sub { margin-top: 2px; font-size: 13.5px; color: var(--ink-2); max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }

/* herói: a sobra do período + fita de distribuição */
.hero { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 44px; align-items: center; padding: 30px 34px; }
.hero-label { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.hero-figure { margin-top: 4px; font-size: clamp(46px, 6vw, 64px); font-weight: 750; letter-spacing: -.04em; line-height: 1.02; }
.money-fig .cur { font-size: .36em; font-weight: 650; letter-spacing: 0; margin-right: .22em; color: var(--ink-2); vertical-align: .62em; }
.money-fig .cents { font-size: .5em; font-weight: 650; letter-spacing: 0; color: var(--ink-2); }
.money-fig .sign { margin-right: .04em; }
.hero-figure.neg { color: var(--bad-text); }
.hero-note { margin-top: 12px; font-size: 14.5px; color: var(--ink-2); max-width: 36ch; }
.hero-note .i { color: var(--bad-text); margin-right: 4px; }

.ribbon-wrap { min-width: 0; }
.ribbon { position: relative; display: flex; gap: 2px; height: 30px; }
.ribbon > i { display: block; min-width: 0; height: 100%; }
.ribbon > i:first-child { border-radius: 8px 0 0 8px; } .ribbon > i:last-of-type { border-radius: 0 8px 8px 0; }
.ribbon > i:only-of-type { border-radius: 8px; }
.ribbon .limit { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); border-radius: 2px; }
.ribbon .limit span { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.ribbon-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.lg-item { min-width: 0; }
.lg-name { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.lg-key { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.lg-val { margin-top: 2px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.lg-pct { font-size: 12.5px; color: var(--ink-3); }

/* faixa de indicadores (uma peça só, dividida por linhas finas) */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; overflow: hidden; }
.kpi { padding: 20px 22px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi-top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.kpi-dot { width: 9px; height: 9px; border-radius: 3px; }
.kpi-value { margin-top: 6px; font-size: 26px; font-weight: 720; letter-spacing: -.03em; line-height: 1.1; }
.kpi-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 10px; min-height: 30px; }
.kpi-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.spark { flex: none; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 650; line-height: 1.3; }
.delta.good { color: var(--good-text); } .delta.bad { color: var(--bad-text); } .delta.flat { color: var(--ink-3); font-weight: 500; }

/* ---------- Gráficos ---------- */
.chart-wrap { position: relative; height: 270px; }
.chart-wrap.short { height: 230px; }
.chart-empty { display: grid; place-items: center; height: 180px; text-align: center; color: var(--ink-3); font-size: 14px; padding: 0 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -4px 0 12px; font-size: 13px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.legend .k-rect { width: 12px; height: 12px; border-radius: 4px; }
.legend .k-line { width: 16px; height: 3px; border-radius: 3px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.data-table th { text-align: left; font-weight: 600; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.data-table th:not(:first-child), .data-table td:not(:first-child) { text-align: right; }
.table-scroll { max-height: 270px; overflow: auto; }

/* barras ordenadas */
.rank { display: flex; flex-direction: column; gap: 4px; }
.rank-row {
  display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto 42px; align-items: center; gap: 12px;
  padding: 6px 8px; margin: 0 -8px; border-radius: 10px; font-size: 14px;
}
.rank-row:hover { background: var(--surface-2); }
.rank-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.rank-track { height: 10px; border-radius: 0 4px 4px 0; position: relative; }
.rank-bar { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.rank-val { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.rank-share { color: var(--ink-3); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.rank-track::before { content: ""; position: absolute; left: 0; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }

/* barras de planejado × real */
.bullet-row { display: grid; grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; font-size: 14px; }
.bullet-row:hover { background: var(--surface-2); }
.bullet-track { position: relative; height: 12px; display: flex; gap: 2px; }
.bullet-track::before { content: ""; position: absolute; left: 0; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }
.bullet-track i { display: block; height: 100%; min-width: 0; }
.bullet-track i:last-of-type { border-radius: 0 4px 4px 0; }
.bullet-tick { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); border-radius: 2px; }
.bullet-val { font-size: 13px; color: var(--ink-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bullet-val b { color: var(--ink); font-weight: 650; }
.bullet-val.over, .bullet-val.over b { color: var(--bad-text); }
.bullet-val .i { margin-right: 3px; }
.key-note { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
.key-note span { display: inline-flex; align-items: center; gap: 6px; }
.key-note .k-rect { width: 12px; height: 8px; border-radius: 3px; }
.key-note .k-tick { width: 2px; height: 12px; background: var(--ink); border-radius: 2px; }

/* ---------- Listas ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item-main { min-width: 0; flex: 1; }
.item-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.check {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent;
  display: inline-grid; place-items: center; color: transparent; flex: none; transition: all .15s; padding: 0;
}
.check:hover { border-color: var(--c-gastos); color: var(--c-gastos); }
.check.on { background: var(--c-invest); border-color: var(--c-invest); color: #fff; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.badge.late { background: color-mix(in srgb, var(--bad-text) 14%, var(--surface)); color: var(--bad-text); }
.badge.soon { background: color-mix(in srgb, var(--c-gastos) 16%, var(--surface)); color: var(--warn-text); }
.dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- Barra de ferramentas e tabelas ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 38px; }
.toolbar select { width: auto; min-width: 150px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; margin-bottom: 16px; overflow: hidden; }
.summary > div { padding: 16px 20px; border-left: 1px solid var(--line); }
.summary > div:first-child { border-left: 0; }
.summary .s-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.summary .s-val { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.summary .s-sub { font-size: 12.5px; color: var(--ink-3); }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl thead th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--surface-2); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.group td { padding: 18px 12px 8px; border-bottom: 1px solid var(--line-strong); font-weight: 700; font-size: 13.5px; color: var(--ink-2); background: none !important; cursor: default; }
.tbl .desc { font-weight: 600; }
.tbl .cat { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.tbl .acts { text-align: right; white-space: nowrap; width: 76px; }
.tbl tr.is-paid .desc { color: var(--ink); }
.m-only { display: none; }
.tbl td.c-amt { display: none; }
.more { display: flex; justify-content: center; padding: 16px 0 4px; }

.empty { display: grid; justify-items: center; gap: 10px; padding: 44px 20px; text-align: center; color: var(--ink-2); }
.empty .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-3); }
.empty h3 { font-size: 16px; color: var(--ink); }
.empty p { max-width: 42ch; font-size: 14px; }

/* ---------- Orçamento ---------- */
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { font-size: 18px; min-width: 150px; text-align: center; letter-spacing: -.02em; }
.meter { height: 14px; border-radius: 8px; background: var(--track); overflow: hidden; display: flex; gap: 2px; }
.meter i { display: block; height: 100%; }
.budget-row { display: grid; grid-template-columns: minmax(110px, 1.1fr) 150px minmax(120px, 2fr) 250px; align-items: center; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.budget-row:first-child { border-top: 0; }
.money { display: flex; align-items: center; position: relative; }
.money > span { position: absolute; left: 12px; color: var(--ink-3); font-size: 13.5px; pointer-events: none; }
.money input { padding-left: 38px; font-variant-numeric: tabular-nums; }
details.fold { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details.fold > summary { cursor: pointer; font-weight: 650; color: var(--ink-2); padding: 6px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold[open] > summary .i { transform: rotate(180deg); }

/* ---------- Investimentos ---------- */
.inv-card { padding: 0; overflow: hidden; }
.inv-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; flex-wrap: wrap; }
.inv-mark { width: 40px; height: 40px; border-radius: 12px; background: color-mix(in srgb, var(--c-invest) 16%, var(--surface)); color: var(--c-invest); display: grid; place-items: center; font-weight: 750; flex: none; }
.inv-title { min-width: 0; flex: 1 1 200px; }
.inv-title b { display: block; font-size: 16px; }
.inv-bal { font-size: 22px; font-weight: 720; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.inv-acts { display: flex; gap: 6px; }
.inv-body { border-top: 1px solid var(--line); padding: 4px 22px 10px; background: var(--surface-2); }
.inv-body summary { cursor: pointer; padding: 12px 0; font-weight: 600; color: var(--ink-2); }
.mov { display: grid; grid-template-columns: 110px 96px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }

/* ---------- Ajustes ---------- */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 4px 5px 12px; border-radius: 999px; background: var(--surface-3); font-size: 13.5px; font-weight: 550; }
.pill button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; padding: 0; }
.pill button:hover { background: var(--surface); color: var(--bad-text); }
.add-row { display: flex; gap: 8px; margin-top: 14px; }
.add-row input { height: 40px; padding: 0 12px; flex: 1; min-width: 0; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--surface); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.row-between + .row-between { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }

.welcome h2 { font-size: 20px; letter-spacing: -.02em; }
.welcome p { color: var(--ink-2); margin-top: 4px; }
.welcome-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.welcome-steps button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface-2); font-weight: 650; }
.welcome-steps button:hover { border-color: var(--accent); }
.welcome-steps .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.welcome-steps small { display: block; font-weight: 500; color: var(--ink-3); font-size: 13px; }

/* ---------- Gaveta de formulário ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s; }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); display: flex; flex-direction: column;
  background: var(--surface); box-shadow: var(--shadow-pop); transform: translateX(28px); opacity: 0;
  transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .18s;
}
.is-open .scrim { opacity: 1; } .is-open .drawer { transform: none; opacity: 1; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 12px; }
.drawer-head h2 { font-size: 20px; letter-spacing: -.02em; }
.drawer-body { flex: 1; overflow-y: auto; padding: 8px 22px 22px; }
.drawer-foot { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .money input:focus, .add-row input:focus, .search input:focus, .toolbar select:focus {
  outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
}
.field-hint { font-size: 12.5px; color: var(--ink-3); }
.field-error { font-size: 13px; color: var(--bad-text); display: flex; gap: 6px; align-items: center; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 600; }
.switch-row input { width: 18px; height: 18px; accent-color: var(--accent); }
.big-amount .money input { height: 54px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; padding-left: 48px; }
.big-amount .money > span { left: 16px; font-size: 16px; font-weight: 650; }
.preview-box { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13.5px; font-weight: 600; margin-bottom: 16px; }
.balance-box { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin-bottom: 16px; font-size: 13.5px; color: var(--ink-2); }
.balance-box b { color: var(--ink); font-size: 18px; display: block; letter-spacing: -.02em; }

/* ---------- Avisos ---------- */
#toast-root { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 550; box-shadow: var(--shadow-pop);
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
}
.toast.in { opacity: 1; transform: none; }
.toast-action { border: 0; background: none; color: inherit; font-weight: 750; text-decoration: underline; padding: 0; }

/* ---------- Carregando e login ---------- */
.loading-screen { display: grid; place-items: center; height: 70vh; color: var(--ink-3); }
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { width: 100%; max-width: 420px; padding: 32px 30px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-pop); }
.auth-card .brand { font-size: 28px; font-weight: 750; letter-spacing: -.03em; display: block; padding: 0; margin-bottom: 22px; }
.auth-card .brand small { display: block; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 4px; }
.auth-tabs { display: flex; padding: 3px; border-radius: 12px; background: var(--surface-3); margin-bottom: 18px; }
.auth-tabs button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: transparent; font-weight: 650; color: var(--ink-2); }
.auth-tabs button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.auth-card .field input { height: 44px; }
.auth-card .btn { width: 100%; height: 46px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.auth-card .btn:hover { background: var(--accent-hover); }
.auth-card .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); width: auto; }
.auth-card .card-title { font-size: 18px; font-weight: 700; }
.auth-card .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13.5px; color: var(--ink-2); }
.auth-msg { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px; line-height: 1.45; }
.auth-msg.error { background: color-mix(in srgb, var(--bad-text) 12%, var(--surface)); color: var(--bad-text); }
.auth-msg.info { background: var(--accent-soft); color: var(--accent-ink); }
.auth-links { margin-top: 16px; text-align: center; font-size: 14px; }
.auth-links a { color: var(--accent-ink); font-weight: 600; }

/* ============================================================
   Responsivo
   ============================================================ */
@media (max-width: 1100px) {
  .hero { grid-template-columns: 1fr; gap: 26px; }
  .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
  .kpis, .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3), .summary > div:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3), .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 1023px) and (min-width: 761px) {
  :root { --rail-w: 76px; }
  .brand-name, .nav-item span, .who, .rail-user .avatar { display: none; }
  .nav-item { justify-content: center; padding: 12px 0; }
  .rail { padding: 22px 10px 16px; align-items: stretch; }
  .brand { justify-content: center; padding: 0; }
  .rail-user { display: flex; flex-direction: column; padding-top: 12px; }
}
@media (max-width: 760px) {
  :root { --r-panel: 16px; }
  body { font-size: 15px; }
  .rail { display: contents; }
  .brand, .rail-user { display: none; }
  .l-full { display: none; }
  .l-short { display: inline; }
  .main { margin-left: 0; padding-bottom: 84px; }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; flex-direction: row; justify-content: space-around; gap: 0;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line);
  }
  .nav-item { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11px; width: auto; flex: 1; text-align: center; border-radius: 12px; }
  .nav-item[aria-current="page"] { background: none; }
  .nav-item[aria-current="page"] .i { background: var(--accent-soft); border-radius: 12px; padding: 4px 14px; box-sizing: content-box; margin: -4px 0; }
  .topbar { padding: 14px 16px 8px; }
  .view { padding: 8px 16px 40px; }
  .period-title { font-size: 24px; }
  .period-filters { gap: 10px; margin-top: 10px; }
  .panel { padding: 18px; }
  .hero { padding: 22px 20px; }
  .ribbon-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 16px; } .kpi-value { font-size: 22px; }
  .chart-wrap { height: 230px; } .chart-wrap.short { height: 200px; }
  .rank-row { grid-template-columns: minmax(0, 1fr) auto 38px; grid-template-areas: "l v s" "b b b"; row-gap: 6px; }
  .rank-label { grid-area: l; } .rank-val { grid-area: v; } .rank-share { grid-area: s; } .rank-track { grid-area: b; }
  .bullet-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "b b"; row-gap: 6px; }
  .bullet-row > :nth-child(1) { grid-area: l; } .bullet-row > :nth-child(2) { grid-area: b; } .bullet-row > :nth-child(3) { grid-area: v; }
  .budget-row { grid-template-columns: minmax(0, 1fr) 130px; grid-template-areas: "n i" "b b" "t t"; row-gap: 8px; }
  .budget-row > :nth-child(1) { grid-area: n; } .budget-row > :nth-child(2) { grid-area: i; } .budget-row > :nth-child(3) { grid-area: b; } .budget-row > :nth-child(4) { grid-area: t; text-align: left; }
  .toolbar .search { max-width: none; flex-basis: 100%; }
  .toolbar select { flex: 1; min-width: 0; }
  .welcome-steps, .set-grid { grid-template-columns: 1fr; }
  .summary .s-val { font-size: 18px; }
  .mov { grid-template-columns: 1fr auto; grid-template-areas: "t v" "d o"; row-gap: 2px; }

  /* tabelas viram lista de cartões */
  .tbl thead { display: none; }
  .tbl, .tbl tbody { display: block; }
  .tbl tr.row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; column-gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tbl tr.row td { display: none; padding: 0; border: 0; background: none !important; }
  .tbl tr.row td.c-check, .tbl tr.row td.c-desc, .tbl tr.row td.c-amt { display: block; }
  .tbl tr.row td.c-check { grid-column: 1; align-self: center; }
  .tbl tr.row td.c-desc { grid-column: 2; min-width: 0; }
  .tbl tr.row td.c-amt { grid-column: 3; text-align: right; align-self: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tbl tr.group { display: block; } .tbl tr.group td { display: block; padding: 16px 0 6px; }
  .m-only { display: flex; }
  .m-meta { gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .drawer { top: auto; left: 0; right: 0; width: 100%; max-height: 94vh; border-radius: 22px 22px 0 0; transform: translateY(32px); }
  #toast-root { bottom: 92px; width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media print { .rail, .nav, .topbar-actions, .toolbar { display: none !important; } .main { margin: 0; } }

</style>

<body>
<div id="root"><div class="loading-screen">Carregando…</div></div>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
/* Caderneta — núcleo: dados, login e gravação no Supabase */

/* ---------- Utils ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => new Date().toISOString().slice(0, 10);
const pad2 = (n) => String(n).padStart(2, '0');

function formatBRL(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function parseNumberInput(str) {
  if (str === null || str === undefined || str === '') return null;
  const n = typeof str === 'number' ? str : parseFloat(String(str).replace(/\./g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
}
function fmtDateBR(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function monthKey(iso) { return iso ? iso.slice(0, 7) : null; } // YYYY-MM
function yearOf(iso) { return iso ? iso.slice(0, 4) : null; }
function monthLabel(mk) {
  const [y, m] = mk.split('-');
  return `${MONTH_NAMES_SHORT[parseInt(m, 10) - 1]}/${y.slice(2)}`;
}
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, Math.min(d, 28));
  return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTH_NAMES_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* ---------- Default config ---------- */
const DEFAULT_CONFIG = {
  categoriasGastos: [
    'Casa','Aluguel','Condomínio','Faxina/Zeladoria','Energia (EDP)','Água','Internet',
    'Farmácia','Academia','Assinaturas','Dados/Celular','Transporte Escolar','Supermercado',
    'Uber','Abastecimento','Carro','Alimentação','Ifood','Entretenimento','Viagem','Roupas',
    'Presentes','Estudo','Higiene/Cuidado','Hardware/Software','Aleatórios'
  ],
  categoriasGanhos: [
    'Salário','Aposentadoria','Aluguel Recebido','Restituição','Dividendos','Extra','Outros'
  ],
  metodosPagamento: ['Crédito','Débito','Dinheiro','Pix','Boleto','Transferência'],
  contas: ['C6','Itaú','Nubank','Caixa'],
  tiposInvestimento: ['CDB','Poupança','Tesouro Direto','Ações','Fundos Imobiliários','Previdência','Cripto','Outro']
};

const TIPOS_LANCAMENTO = ['Fixo', 'Pontual', 'Extraordinário'];
const STATUS_GASTO = ['Previsto', 'Pago', 'Atrasado'];
const TIPOS_MOVIMENTACAO_INVEST = ['Aporte', 'Resgate', 'Rendimento'];

/* ---------- State ---------- */
const state = {
  loaded: false,
  expenses: [],
  incomes: [],
  investments: [],
  budgets: [],
  config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
  ui: {
    tab: 'resumo',
    rangeMode: 'month',       // 'month' | 'range' | 'year'
    selectedMonth: todayStr().slice(0, 7),
    rangeStart: todayStr().slice(0, 7),
    rangeEnd: todayStr().slice(0, 7),
    selectedYear: todayStr().slice(0, 4),
    lancamentosFilter: { categoria: '', status: '', busca: '', tipo: '' },
    ganhosFilter: { busca: '' },
    orcamentoMonth: todayStr().slice(0, 7),
  }
};

/* ============================================================
   SUPABASE: conexão, login e gravação no banco
   Os dados de cada pessoa ficam na tabela user_data, protegidos
   por RLS (cada usuário só enxerga e altera as próprias linhas).
   ============================================================ */
let sb = null;
let currentUser = null;
let authView = 'booting';   // booting | needsConfig | login | signup | forgot | recovery | loadError | ready
let authMessage = null;     // { type: 'error' | 'info', text }
let authDraftEmail = '';
let saveStatus = 'saved';   // saved | saving | error
let recoveryMode = false;
let loggingOut = false;
const DATA_KEYS = ['expenses', 'incomes', 'investments', 'budgets', 'config'];
const _dirty = new Set();   // chaves com alteração ainda não confirmada pelo banco
const _ver = {};            // contador de alterações por chave
const _saveTimers = {};
const _retryTimers = {};

function configOk() {
  if (typeof APP_CONFIG === 'undefined') return false;
  const u = String(APP_CONFIG.SUPABASE_URL || '');
  const k = String(APP_CONFIG.SUPABASE_KEY || '');
  return /^https:\/\//i.test(u) && k.length > 20 && !/COLE_AQUI/i.test(u + k);
}

function redirectUrl() { return location.href.split('#')[0].split('?')[0]; }

function friendlyAuthError(err) {
  const m = String((err && err.message) || err || '').toLowerCase();
  if (m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed')) return 'Este e-mail ainda não foi confirmado. Abra o e-mail que enviamos e clique no link.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'Já existe uma conta com este e-mail. Use a aba "Entrar".';
  if (m.includes('at least') && m.includes('characters')) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (m.includes('rate limit') || m.includes('too many') || m.includes('security purposes')) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if (m.includes('signups not allowed') || m.includes('signup is disabled') || m.includes('signups are disabled')) return 'A criação de novas contas está desativada. Peça a quem administra o app.';
  if (m.includes('invalid email') || m.includes('unable to validate email')) return 'Esse e-mail não parece válido.';
  if (m.includes('failed to fetch') || m.includes('network')) return 'Sem conexão com a internet.';
  if (m.includes('different from the old') || m.includes('same password')) return 'A nova senha precisa ser diferente da anterior.';
  return 'Algo deu errado: ' + ((err && err.message) || 'erro desconhecido');
}

function friendlyDbError(err) {
  const msg = String((err && err.message) || err || '');
  if ((err && (err.code === '42P01' || err.code === 'PGRST205')) || /does not exist|could not find the table/i.test(msg)) {
    return 'A tabela do banco ainda não foi criada. Rode o arquivo supabase-setup.sql no SQL Editor do Supabase (passo 4 do guia).';
  }
  if (/failed to fetch|network/i.test(msg)) return 'Sem conexão com a internet.';
  return 'Não foi possível carregar seus dados: ' + msg;
}

/* ---------- Leitura ---------- */
async function dbLoadAll() {
  const { data, error } = await sb.from('user_data').select('key,value');
  if (error) throw error;
  const fresh = {};
  (data || []).forEach(r => { if (DATA_KEYS.includes(r.key)) fresh[r.key] = r.value; });
  state.expenses = Array.isArray(fresh.expenses) ? fresh.expenses : [];
  state.incomes = Array.isArray(fresh.incomes) ? fresh.incomes : [];
  state.investments = Array.isArray(fresh.investments) ? fresh.investments : [];
  state.budgets = Array.isArray(fresh.budgets) ? fresh.budgets : [];
  state.config = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_CONFIG)), fresh.config || {});
  for (const k of Object.keys(DEFAULT_CONFIG)) {
    if (!Array.isArray(state.config[k]) || state.config[k].length === 0) state.config[k] = JSON.parse(JSON.stringify(DEFAULT_CONFIG[k]));
  }
  state.loaded = true;
}

function resetState() {
  state.expenses = []; state.incomes = []; state.investments = []; state.budgets = [];
  state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  state.loaded = false;
  state.ui.tab = 'resumo';
  _dirty.clear();
  Object.keys(_saveTimers).forEach(k => { clearTimeout(_saveTimers[k]); delete _saveTimers[k]; });
  Object.keys(_retryTimers).forEach(k => { clearTimeout(_retryTimers[k]); delete _retryTimers[k]; });
  saveStatus = 'saved';
}

/* ---------- Gravação ---------- */
async function dbWrite(key, value) {
  const { error } = await sb.from('user_data').upsert(
    { user_id: currentUser.id, key, value, updated_at: new Date().toISOString() },
    { onConflict: 'user_id,key' }
  );
  if (error) throw error;
}

function saveStatusText() {
  if (saveStatus === 'saving') return 'salvando…';
  if (saveStatus === 'error') return '⚠ não salvou — tentando de novo';
  return 'tudo salvo na nuvem';
}
function setSaveStatus(s) {
  saveStatus = s;
  const el = document.getElementById('save-status');
  if (el) { el.textContent = saveStatusText(); el.className = 'save-status ' + s; }
}

function save(key) {
  _ver[key] = (_ver[key] || 0) + 1;
  _dirty.add(key);
  setSaveStatus('saving');
  clearTimeout(_saveTimers[key]);
  _saveTimers[key] = setTimeout(() => flushKey(key), 300);
}

async function flushKey(key) {
  clearTimeout(_saveTimers[key]); delete _saveTimers[key];
  clearTimeout(_retryTimers[key]); delete _retryTimers[key];
  if (!currentUser || !sb) return false;
  const startVer = _ver[key] || 0;
  try {
    await dbWrite(key, state[key]);
    if ((_ver[key] || 0) === startVer) _dirty.delete(key);
    if (_dirty.size === 0) setSaveStatus('saved');
    return true;
  } catch (e) {
    console.error('Falha ao salvar', key, e);
    if (saveStatus !== 'error') showToast('Não consegui salvar. Vou tentar de novo automaticamente.');
    setSaveStatus('error');
    _retryTimers[key] = setTimeout(() => { if (_dirty.has(key) && currentUser) flushKey(key); }, 5000);
    return false;
  }
}

async function flushAll() {
  const keys = Array.from(_dirty);
  const res = await Promise.all(keys.map(flushKey));
  return res.every(Boolean);
}

// usado na importação: espera a gravação terminar de verdade
async function saveNow(key) {
  _ver[key] = (_ver[key] || 0) + 1;
  _dirty.add(key);
  const ok = await flushKey(key);
  if (!ok) throw new Error('Falha ao gravar ' + key);
}

window.addEventListener('beforeunload', (e) => {
  if (_dirty.size > 0) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- Atualiza ao voltar para a aba (outro aparelho pode ter alterado) ---------- */
async function refreshFromServer() {
  if (authView !== 'ready' || !currentUser || _dirty.size > 0) return;
  if (document.querySelector('.drawer')) return;
  try { await dbLoadAll(); render(); } catch (e) { console.error('Falha ao atualizar', e); }
}
let _liveRegistered = false;
function registerLiveRefresh() {
  if (_liveRegistered) return;
  _liveRegistered = true;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshFromServer();
  });
  window.addEventListener('online', () => { flushAll().then(refreshFromServer); });
}

/* ---------- Sessão ---------- */
async function enterApp(user) {
  currentUser = user;
  try {
    await dbLoadAll();
    authView = 'ready';
    authMessage = null;
    registerLiveRefresh();
  } catch (e) {
    console.error(e);
    authView = 'loadError';
    authMessage = { type: 'error', text: friendlyDbError(e) };
  }
  render();
}

function onSignedOut() {
  const wasIn = !!currentUser;
  currentUser = null;
  resetState();
  authView = 'login';
  authMessage = (wasIn && !loggingOut) ? { type: 'info', text: 'Sua sessão terminou. Entre novamente.' } : null;
  loggingOut = false;
  render();
}

async function doLogout() {
  if (_dirty.size > 0) {
    const ok = await flushAll();
    if (!ok && !confirm('Algumas alterações ainda não foram salvas (sem conexão?). Sair mesmo assim e perder essas alterações?')) return;
  }
  loggingOut = true;
  try { await sb.auth.signOut(); } catch (e) { console.error(e); }
  onSignedOut();
}

async function startApp() {
  const hash = location.hash || '';
  recoveryMode = /type=recovery/.test(hash);
  const linkError = /error_code=|error=access_denied/.test(hash);

  if (!configOk()) { authView = 'needsConfig'; render(); return; }
  if (!window.supabase || !window.supabase.createClient) {
    authView = 'loadError';
    authMessage = { type: 'error', text: 'Não consegui carregar a biblioteca de conexão. Verifique a internet e recarregue a página.' };
    render(); return;
  }
  sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' }
  });
  // atenção: aqui dentro não chamamos outras funções do Supabase (evita travamento)
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recoveryMode = true; authView = 'recovery'; authMessage = null; render(); }
    else if (event === 'SIGNED_OUT') onSignedOut();
  });

  let session = null;
  try { const r = await sb.auth.getSession(); session = r.data && r.data.session; } catch (e) { console.error(e); }

  if (linkError) {
    authView = 'login';
    authMessage = { type: 'error', text: 'Esse link expirou ou já foi usado. Peça um novo em "Esqueci minha senha".' };
    history.replaceState(null, '', redirectUrl());
    render(); return;
  }
  if (recoveryMode) {
    if (session) { authView = 'recovery'; }
    else { authView = 'login'; authMessage = { type: 'error', text: 'Esse link expirou ou já foi usado. Peça um novo em "Esqueci minha senha".' }; }
    render(); return;
  }
  if (session) await enterApp(session.user);
  else { authView = 'login'; render(); }
}

async function handleAuthSubmit(mode, email, password, password2) {
  const fail = (text) => { authMessage = { type: 'error', text }; render(); };
  if (mode === 'login') {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return fail(friendlyAuthError(error));
    return enterApp(data.user);
  }
  if (mode === 'signup') {
    if (password.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    if (password !== password2) return fail('As duas senhas não são iguais.');
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectUrl() } });
    if (error) return fail(friendlyAuthError(error));
    if (data && data.session) return enterApp(data.user);
    authView = 'login';
    authMessage = { type: 'info', text: 'Conta criada! Enviamos um e-mail de confirmação: abra, clique no link e depois volte aqui para entrar.' };
    return render();
  }
  if (mode === 'forgot') {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
    if (error) return fail(friendlyAuthError(error));
    authView = 'login';
    authMessage = { type: 'info', text: 'Se esse e-mail tiver conta, enviamos um link para criar uma nova senha. Confira também a caixa de spam.' };
    return render();
  }
  if (mode === 'recovery') {
    if (password.length < 6) return fail('A senha precisa ter pelo menos 6 caracteres.');
    if (password !== password2) return fail('As duas senhas não são iguais.');
    const { data, error } = await sb.auth.updateUser({ password });
    if (error) return fail(friendlyAuthError(error));
    recoveryMode = false;
    history.replaceState(null, '', redirectUrl());
    return enterApp(data.user);
  }
}

function attachAuthHandlers() {
  const root = document.getElementById('root');
  root.querySelectorAll('[data-auth-view]').forEach(el => el.addEventListener('click', (ev) => {
    ev.preventDefault();
    const f = root.querySelector('input[name=email]');
    if (f) authDraftEmail = f.value;
    authView = el.getAttribute('data-auth-view');
    authMessage = null;
    render();
  }));
  const sp = document.getElementById('show-pass');
  if (sp) sp.addEventListener('change', () => {
    root.querySelectorAll('input[data-pw]').forEach(i => { i.type = sp.checked ? 'text' : 'password'; });
  });
  root.querySelectorAll('[data-auth-action]').forEach(el => el.addEventListener('click', () => {
    const a = el.getAttribute('data-auth-action');
    if (a === 'retry') { if (currentUser) enterApp(currentUser); else location.reload(); }
    if (a === 'logout') doLogout();
  }));
  const form = document.getElementById('auth-form');
  if (form) form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(form);
    const email = String(fd.get('email') || '').trim();
    authDraftEmail = email || authDraftEmail;
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'aguarde…';
    try {
      await handleAuthSubmit(form.getAttribute('data-mode'), email, String(fd.get('password') || ''), String(fd.get('password2') || ''));
    } catch (e) {
      console.error(e);
      authMessage = { type: 'error', text: friendlyAuthError(e) };
      render();
    }
  });
}



/* ---------- Period selection helpers ---------- */
function getActiveMonthKeys() {
  const ui = state.ui;
  if (ui.rangeMode === 'month') return [ui.selectedMonth];
  if (ui.rangeMode === 'year') {
    return Array.from({ length: 12 }, (_, i) => `${ui.selectedYear}-${pad2(i + 1)}`);
  }
  // range
  let start = ui.rangeStart, end = ui.rangeEnd;
  if (start > end) [start, end] = [end, start];
  const out = [];
  let cur = start;
  let guard = 0;
  while (cur <= end && guard < 240) {
    out.push(cur);
    const [y, m] = cur.split('-').map(Number);
    const next = m === 12 ? `${y + 1}-01` : `${y}-${pad2(m + 1)}`;
    cur = next;
    guard++;
  }
  return out;
}
function periodLabel() {
  const ui = state.ui;
  if (ui.rangeMode === 'month') {
    const [y, m] = ui.selectedMonth.split('-');
    return `${MONTH_NAMES[parseInt(m, 10) - 1]} de ${y}`;
  }
  if (ui.rangeMode === 'year') return `Ano de ${ui.selectedYear}`;
  const keys = getActiveMonthKeys();
  if (keys.length === 0) return '—';
  return `${monthLabel(keys[0])} — ${monthLabel(keys[keys.length - 1])}`;
}
function inActivePeriod(iso) {
  if (!iso) return false;
  return getActiveMonthKeys().includes(monthKey(iso));
}
function expensesInPeriod() { return state.expenses.filter(e => inActivePeriod(e.dataPagamento)); }
function incomesInPeriod() { return state.incomes.filter(i => inActivePeriod(i.dataPagamento)); }
function investMovsInPeriod() {
  const out = [];
  state.investments.forEach(inv => (inv.movimentacoes || []).forEach(mv => {
    if (inActivePeriod(mv.data)) out.push({ ...mv, invId: inv.id, invTipo: inv.tipo, invInst: inv.instituicao });
  }));
  return out;
}
function allYearsAvailable() {
  const set = new Set();
  state.expenses.forEach(e => e.dataPagamento && set.add(yearOf(e.dataPagamento)));
  state.incomes.forEach(i => i.dataPagamento && set.add(yearOf(i.dataPagamento)));
  set.add(todayStr().slice(0, 4));
  return Array.from(set).sort();
}

/* ---------- Aggregations ---------- */
function sumValor(list, key) { return list.reduce((acc, x) => acc + (Number(x[key]) || 0), 0); }

function investmentBalance(inv) {
  let bal = 0;
  (inv.movimentacoes || []).forEach(mv => {
    if (mv.tipo === 'Resgate') bal -= Number(mv.valor) || 0;
    else bal += Number(mv.valor) || 0;
  });
  return bal;
}
function totalPatrimonioInvestido() {
  return state.investments.reduce((acc, inv) => acc + investmentBalance(inv), 0);
}

function categoryActualsForMonth(mk, categoria) {
  return state.expenses
    .filter(e => monthKey(e.dataPagamento) === mk && e.categoria === categoria)
    .reduce((acc, e) => acc + (Number(e.valorReal ?? e.valorEstimado) || 0), 0);
}
function budgetFor(mk, categoria) {
  const b = state.budgets.find(x => x.mes === mk && x.categoria === categoria);
  return b ? Number(b.valor) || 0 : 0;
}

/* ---------- CRUD helpers ---------- */
function addExpense(exp) { state.expenses.push(exp); save('expenses'); }
function updateExpense(id, patch) {

  if (i > -1) { state.expenses[i] = { ...state.expenses[i], ...patch }; save('expenses'); }

function removeExpenseGroup(groupId) { state.expenses = state.expenses.filter(e => e.grupoParcelaId !== groupId); save('expenses'); }

function addIncome(inc) { state.incomes.push(inc); save('incomes'); }
function updateIncome(id, patch) {

  if (i > -1) { state.incomes[i] = { ...state.incomes[i], ...patch }; save('incomes'); }
}
function removeIncome(id) { state.incomes = state.incomes.filter(e => e.id !== id); save('incomes'); }

function addInvestment(inv) { state.investments.push(inv); save('investments'); }
function updateInvestment(id, patch) {
  const i = state.investments.findIndex(e => e.id === id);

}

function upsertBudget(mes, categoria, valor) {
  const i = state.budgets.findIndex(b => b.mes === mes && b.categoria === categoria);
  if (valor === null || valor === 0) {
    if (i > -1) state.budgets.splice(i, 1);
  } else if (i > -1) {
    state.budgets[i].valor = valor;
  } else {
    state.budgets.push({ id: uid(), mes, categoria, valor });
  }
  save('budgets');
}

function addCategoria(list, value) {
  const v = value.trim();
  if (!v) return false;
  if (state.config[list].some(c => c.toLowerCase() === v.toLowerCase())) return false;
  state.config[list].push(v);
  save('config');
  return true;
}
function removeCategoria(list, value) {
  state.config[list] = state.config[list].filter(c => c !== value);
  save('config');
}


/* ============================================================
   ANÁLISES — todos os números do panorama saem daqui
   ============================================================ */
const hasNum = (v) => v !== null && v !== undefined && v !== '' && !isNaN(Number(v));
const N = (v) => (hasNum(v) ? Number(v) : 0);

// Um gasto está pago se o status é "Pago" ou se já tem valor real informado.
function isPaid(e) { return e.status === 'Pago' || hasNum(e.valorReal); }
function paidAmount(e) { return hasNum(e.valorReal) ? N(e.valorReal) : N(e.valorEstimado); }
function plannedAmount(e) { return hasNum(e.valorEstimado) ? N(e.valorEstimado) : N(e.valorReal); }
// quanto o gasto pesa: o real, se já foi pago; senão o planejado
function expenseAmount(e) { return isPaid(e) ? paidAmount(e) : plannedAmount(e); }
function isOverdue(e) { return !isPaid(e) && !!e.dataPagamento && e.dataPagamento < todayStr(); }

/* ---------- Meses ---------- */
function shiftMonthKey(mk, n) {
  const [y, m] = mk.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function trailingKeys(endKey, n) { return Array.from({ length: n }, (_, i) => shiftMonthKey(endKey, i - (n - 1))); }
function monthNameOf(mk) { return MONTH_NAMES[parseInt(mk.slice(5), 10) - 1]; }
function lastActiveKey() { const k = getActiveMonthKeys(); return k[k.length - 1]; }
function prevPeriodKeys() { const keys = getActiveMonthKeys(); const n = keys.length; return keys.map(k => shiftMonthKey(k, -n)); }
function compareLabel() {
  const ui = state.ui;
  if (ui.rangeMode === 'month') return monthNameOf(shiftMonthKey(ui.selectedMonth, -1)).toLowerCase();
  if (ui.rangeMode === 'year') return String(Number(ui.selectedYear) - 1);
  return 'período anterior';
}
function periodNoun() {
  const m = state.ui.rangeMode;
  return m === 'month' ? 'do mês' : m === 'year' ? 'do ano' : 'do período';
}

/* ---------- Resumo de um conjunto de meses ---------- */
function periodStats(keys) {
  const set = new Set(keys);
  let pago = 0, aPagar = 0, planejado = 0, nGastos = 0, atrasado = 0, nAtrasado = 0;
  state.expenses.forEach(e => {
    if (!set.has(monthKey(e.dataPagamento))) return;
    nGastos++;
    planejado += plannedAmount(e);
    if (isPaid(e)) pago += paidAmount(e);
    else {
      const v = plannedAmount(e);
      aPagar += v;
      if (isOverdue(e)) { atrasado += v; nAtrasado++; }
    }
  });
  let ganhos = 0, nGanhos = 0;
  state.incomes.forEach(i => { if (set.has(monthKey(i.dataPagamento))) { ganhos += N(i.valor); nGanhos++; } });
  let aportes = 0, resgates = 0, rendimentos = 0;
  state.investments.forEach(inv => (inv.movimentacoes || []).forEach(m => {
    if (!set.has(monthKey(m.data))) return;
    if (m.tipo === 'Resgate') resgates += N(m.valor);
    else if (m.tipo === 'Rendimento') rendimentos += N(m.valor);
    else aportes += N(m.valor);
  }));
  const investido = Math.max(0, aportes - resgates);
  const gastos = pago + aPagar;
  return { ganhos, nGanhos, pago, aPagar, gastos, planejado, nGastos, atrasado, nAtrasado, aportes, resgates, rendimentos, investido, livre: ganhos - gastos - investido };
}

function patrimonioAt(mk) {
  let b = 0;
  state.investments.forEach(inv => (inv.movimentacoes || []).forEach(m => {
    if (m.data && monthKey(m.data) <= mk) b += m.tipo === 'Resgate' ? -N(m.valor) : N(m.valor);
  }));
  return b;
}

/* ---------- Agrupamentos ---------- */
function groupExpenses(keys, getKey) {
  const set = new Set(keys), map = {};
  state.expenses.forEach(e => {
    if (!set.has(monthKey(e.dataPagamento))) return;
    const k = getKey(e) || 'Sem informação';
    const g = map[k] || (map[k] = { label: k, pago: 0, aPagar: 0, plan: 0, total: 0 });
    g.plan += plannedAmount(e);
    if (isPaid(e)) g.pago += paidAmount(e); else g.aPagar += plannedAmount(e);
    g.total = g.pago + g.aPagar;
  });
  return Object.values(map).sort((a, b) => b.total - a.total);
}
function groupIncomes(keys, getKey) {
  const set = new Set(keys), map = {};
  state.incomes.forEach(i => {
    if (!set.has(monthKey(i.dataPagamento))) return;
    const k = getKey(i) || 'Sem informação';
    map[k] = (map[k] || 0) + N(i.valor);
  });
  return Object.entries(map).map(([label, total]) => ({ label, total })).sort((a, b) => b.total - a.total);
}
// mostra as N maiores e junta o resto em "Outras"
function topWithOthers(items, n, valueKey = 'total') {
  if (items.length <= n) return items;
  const head = items.slice(0, n - 1), tail = items.slice(n - 1);
  const other = { label: `Outras (${tail.length})` };
  ['pago', 'aPagar', 'plan', 'total'].forEach(k => { if (tail[0] && k in tail[0]) other[k] = tail.reduce((a, x) => a + x[k], 0); });
  return [...head, other];
}
function topExpenses(keys, n) {
  const set = new Set(keys);
  return state.expenses.filter(e => set.has(monthKey(e.dataPagamento)))
    .sort((a, b) => expenseAmount(b) - expenseAmount(a)).slice(0, n);
}
function pendingExpenses(keys) {
  const set = new Set(keys);
  return state.expenses.filter(e => set.has(monthKey(e.dataPagamento)) && !isPaid(e))
    .sort((a, b) => a.dataPagamento.localeCompare(b.dataPagamento));
}

/* ---------- Ritmo do mês (acumulado dia a dia) ---------- */
function dailyPace(mk) {
  const [y, m] = mk.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const real = new Array(days).fill(0), plan = new Array(days).fill(0);
  state.expenses.forEach(e => {
    if (monthKey(e.dataPagamento) !== mk) return;
    const d = parseInt(e.dataPagamento.slice(8, 10), 10) - 1;
    if (d < 0 || d >= days) return;
    plan[d] += plannedAmount(e);
    if (isPaid(e)) real[d] += paidAmount(e);
  });
  let a = 0, b = 0;
  const cumReal = real.map(v => (a += v)), cumPlan = plan.map(v => (b += v));
  const today = todayStr();
  const curMk = today.slice(0, 7);
  const lastDay = mk < curMk ? days : mk === curMk ? parseInt(today.slice(8, 10), 10) : 0;
  return {
    days,
    labels: Array.from({ length: days }, (_, i) => String(i + 1)),
    real: cumReal.map((v, i) => (i < lastDay ? v : null)),
    plan: cumPlan,
  };
}

/* ---------- Orçamento ---------- */
function budgetSplit(mk) {
  const map = {};
  groupExpenses([mk], e => e.categoria).forEach(g => { map[g.label] = g; });
  return map;
}

/* ---------- Formatação ---------- */
function fmtCompact(v) {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return `${s}R$ ${(a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mi`;
  if (a >= 1e3) return `${s}R$ ${(a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: a >= 1e4 ? 0 : 1 })} mil`;
  return `${s}R$ ${Math.round(a).toLocaleString('pt-BR')}`;
}
function fmtAxis(v) {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return `${s}${(a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mi`;
  if (a >= 1e3) return `${s}${(a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} mil`;
  return `${s}${a.toLocaleString('pt-BR')}`;
}
function moneyHtml(v) {
  const neg = v < 0 && Math.abs(v) >= 0.005, a = Math.abs(v);
  const [int, dec] = a.toFixed(2).split('.');
  return `<span class="money-fig">${neg ? '<span class="sign">−</span>' : ''}<span class="cur">R$</span>${Number(int).toLocaleString('pt-BR')}<span class="cents">,${dec}</span></span>`;
}
function pctOf(part, whole) { return whole > 0 ? Math.round((part / whole) * 100) : 0; }
function dayMonthBR(iso) { return iso ? `${iso.slice(8, 10)} ${MONTH_NAMES_SHORT[parseInt(iso.slice(5, 7), 10) - 1].toLowerCase()}` : '—'; }
function daysFromToday(iso) {
  const a = new Date(todayStr() + 'T00:00:00'), b = new Date(iso + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function deltaChip(cur, prev, upIsGood, label) {
  if (!prev && !cur) return '<span class="delta flat">sem movimento</span>';
  if (!prev) return `<span class="delta flat">sem dados em ${escapeHtml(label)}</span>`;
  const pct = ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(pct) < 0.5) return `<span class="delta flat">${icon('minus', 14)} igual a ${escapeHtml(label)}</span>`;
  const up = pct > 0, good = up === upIsGood;
  return `<span class="delta ${good ? 'good' : 'bad'}">${icon(up ? 'up' : 'downarrow', 14)} ${Math.abs(pct).toFixed(0)}% vs ${escapeHtml(label)}</span>`;
}

/* ---------- Mini gráfico de linha (KPIs) ---------- */
function sparkline(values, color) {
  const n = values.length;
  if (n < 2) return '';
  const w = 96, h = 30, pad = 5;
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const pts = values.map((v, i) => [pad + (i * (w - 2 * pad)) / (n - 1), h - pad - ((v - min) / span) * (h - 2 * pad)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const l = pts[n - 1], p = pts[n - 2];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--ink-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} L${l[0].toFixed(1)} ${l[1].toFixed(1)}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

/* ---------- Avisos ---------- */
function showToast(msg, opts = {}) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (opts.action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-action'; b.textContent = opts.action.label;
    b.addEventListener('click', () => { opts.action.onClick(); el.remove(); });
    el.appendChild(b);
  }
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 250); }, opts.duration || (opts.action ? 6500 : 3200));
}

let chartInstances = {};

const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function withAlpha(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function registerChart(id, build) { pendingCharts.push({ id, build }); }
function destroyCharts() { Object.values(chartInstances).forEach(c => c && c.destroy()); chartInstances = {}; }
function mountCharts() {
  destroyCharts();
  const list = pendingCharts; pendingCharts = [];
  if (!list.length) return;
  if (typeof Chart === 'undefined') {
    list.forEach(({ id }) => {
      const el = document.getElementById(id);
      if (el && el.parentElement) el.parentElement.innerHTML = '<div class="chart-empty">Não foi possível carregar o gráfico (sem internet?). Use "Ver tabela" para ler os números.</div>';
    });

  }
  Chart.defaults.font.family = cssVar('--font') || 'system-ui, sans-serif';
  Chart.defaults.font.size = 12;
  list.forEach(({ id, build }) => {
    const el = document.getElementById(id);

    ctx.save(); ctx.strokeStyle = cssVar('--line-strong'); ctx.lineWidth = 1;

};
// rótulo direto no fim de cada linha; se dois colidirem, nenhum é desenhado (a legenda cobre)
const endLabelPlugin = {
  id: 'endLabels',
  afterDatasetsDraw(chart) {
    const items = [];
    chart.data.datasets.forEach((ds, i) => {
      if (!ds.endLabel) return;
      const meta = chart.getDatasetMeta(i);
      for (let k = ds.data.length - 1; k >= 0; k--) {
        if (ds.data[k] !== null && ds.data[k] !== undefined) { const p = meta.data[k]; if (p) items.push({ x: p.x, y: p.y, text: ds.endLabel }); break; }
      }
    });
    for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) if (Math.abs(items[a].y - items[b].y) < 15) return;
    const ctx = chart.ctx;
    ctx.save(); ctx.font = `600 12px ${cssVar('--font')}`; ctx.fillStyle = cssVar('--ink-2'); ctx.textBaseline = 'middle';
    items.forEach(it => ctx.fillText(it.text, it.x + 10, it.y));

          labelColor: (c) => ({ borderColor: c.dataset.solid, backgroundColor: c.dataset.solid, borderWidth: 0, borderRadius: 2 }),
          labelPointStyle: (c) => ({ pointStyle: c.dataset.type === 'line' || c.chart.config.type === 'line' ? 'line' : 'rectRounded', rotation: 0 }),
        },
      },
    },
    scales: {
      x: { grid: { display: false }, border: { color: cssVar('--axis') }, ticks: { ...tick, maxRotation: 0, autoSkipPadding: 14 } },
      y: { beginAtZero: true, grid: { color: cssVar('--grid'), lineWidth: 1 }, border: { display: false }, ticks: { ...tick, maxTicksLimit: 5, padding: 8, callback: (v) => fmtAxis(v) } },
    },
  };
}
function lineDataset({ label, data, color, fill, endLabel, width = 2 }) {
  const surface = cssVar('--surface');
  let last = -1;
  data.forEach((v, i) => { if (v !== null && v !== undefined) last = i; });
  return {
    type: 'line', label, data, solid: color, borderColor: color, borderWidth: width, tension: 0.3,
    borderJoinStyle: 'round', borderCapStyle: 'round', fill: !!fill, backgroundColor: fill ? withAlpha(color, 0.1) : 'transparent',
    pointRadius: data.map((_, i) => (i === last ? 4 : 0)), pointHoverRadius: 5,
    pointBackgroundColor: color, pointBorderColor: surface, pointBorderWidth: 2, pointHoverBorderWidth: 2, spanGaps: false, endLabel,
  };
}

/* ---------- Fluxo mensal: ganhos × gastos ---------- */
function fluxoMonths() {
  const keys = getActiveMonthKeys();
  const single = keys.length === 1;
  return { months: single ? trailingKeys(keys[0], 6) : keys, selected: single ? keys[0] : null };
}
function monthShortLabels(months) {
  const multi = new Set(months.map(m => m.slice(0, 4))).size > 1;
  return months.map(m => MONTH_NAMES_SHORT[parseInt(m.slice(5), 10) - 1] + (multi ? `/${m.slice(2, 4)}` : ''));
}
function fluxoConfig() {
  const { months, selected } = fluxoMonths();
  const stats = months.map(k => periodStats([k]));
  const cG = cssVar('--c-ganhos'), cD = cssVar('--c-gastos');
  const tone = (c, k) => (!selected || k === selected ? c : withAlpha(c, 0.4));
  const full = months.map(k => `${monthNameOf(k)} ${k.slice(0, 4)}`);
  const opt = baseOptions({ tooltipTitle: (items) => full[items[0].dataIndex] });
  opt.plugins.tooltip.callbacks.afterBody = (items) => { const s = stats[items[0].dataIndex]; return `${formatBRL(s.ganhos - s.gastos)}  Ganhos menos gastos`; };
  const mk = (label, key, c) => ({
    label, data: stats.map(s => s[key]), solid: c, backgroundColor: months.map(k => tone(c, k)),
    borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 }, borderSkipped: 'bottom',
    maxBarThickness: 22, categoryPercentage: 0.72, barPercentage: 0.94, inflateAmount: -1,
  });
  return { type: 'bar', data: { labels: monthShortLabels(months), datasets: [mk('Ganhos', 'ganhos', cG), mk('Gastos', 'gastos', cD)] }, options: opt };
}
function fluxoTable() {
  const { months } = fluxoMonths();
  return {
    cols: ['Mês', 'Ganhos', 'Gastos', 'Diferença'],
    rows: months.map(k => { const s = periodStats([k]); return [`${monthNameOf(k)} ${k.slice(0, 4)}`, formatBRL(s.ganhos), formatBRL(s.gastos), formatBRL(s.ganhos - s.gastos)]; }),
  };
}

/* ---------- Ritmo do mês (um mês) ---------- */
function paceConfig() {
  const mk = state.ui.selectedMonth;
  const p = dailyPace(mk);
  const opt = baseOptions({ rightPad: 62, tooltipTitle: (items) => `Dia ${items[0].label}` });
  opt.scales.x.ticks.callback = function (v) { const n = Number(this.getLabelForValue(v)); return n === 1 || n % 5 === 0 ? n : ''; };
  return {
    type: 'line', plugins: [crosshairPlugin, endLabelPlugin],
    data: { labels: p.labels, datasets: [
      lineDataset({ label: 'Previsto', data: p.plan, color: cssVar('--ink-3'), endLabel: 'Previsto' }),
      lineDataset({ label: 'Real', data: p.real, color: cssVar('--c-gastos'), endLabel: 'Real' }),
    ] },
    options: opt,
  };
}
function paceTable() {
  const p = dailyPace(state.ui.selectedMonth);
  const rows = [];
  p.labels.forEach((l, i) => { if (i === 0 || (i + 1) % 5 === 0 || i === p.days - 1) rows.push([`Dia ${l}`, p.real[i] === null ? '—' : formatBRL(p.real[i]), formatBRL(p.plan[i])]); });
  return { cols: ['Dia', 'Real acumulado', 'Previsto acumulado'], rows };
}

/* ---------- Sobra acumulada (vários meses) ---------- */
function saldoSeries() {
  const keys = getActiveMonthKeys(); let acc = 0;
  return keys.map(k => { acc += periodStats([k]).livre; return acc; });
}
function saldoConfig() {
  const keys = getActiveMonthKeys();
  const opt = baseOptions({ tooltipTitle: (items) => { const k = keys[items[0].dataIndex]; return `${monthNameOf(k)} ${k.slice(0, 4)}`; } });
  return { type: 'line', plugins: [crosshairPlugin],
    data: { labels: monthShortLabels(keys), datasets: [lineDataset({ label: 'Sobra acumulada', data: saldoSeries(), color: cssVar('--ink'), fill: true })] }, options: opt };
}
function saldoTable() {
  const keys = getActiveMonthKeys(), acc = saldoSeries();
  return { cols: ['Mês', 'Sobra no mês', 'Sobra acumulada'], rows: keys.map((k, i) => [`${monthNameOf(k)} ${k.slice(0, 4)}`, formatBRL(periodStats([k]).livre), formatBRL(acc[i])]) };
}

/* ---------- Patrimônio investido ---------- */
function patrimonioMonths() { return trailingKeys(lastActiveKey(), 12); }
function patrimonioConfig() {
  const months = patrimonioMonths();

function patrimonioTable() {

function legendHtml(items) {

// painel com gráfico + alternância para tabela
function chartPanel({ id, title, sub, legend, span = 'span-12', short = false, build, table }) {
  const showTable = !!state.ui.tableViews[id];

  if (showTable) {
    const t = table();

  } else {
    registerChart('ch-' + id, build);
    body = `${legend ? legendHtml(legend) : ''}<div class="chart-wrap ${short ? 'short' : ''}"><canvas id="ch-${id}" role="img" aria-label="${escapeHtml(title)}"></canvas></div>`;
  }
