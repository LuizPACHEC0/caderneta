// barras ordenadas: uma cor por entidade, rótulo e valor na ponta
function rankBars(items, color) {
  if (!items.length) return '';
  const max = Math.max(...items.map(i => i.value), 1);
  const total = items.reduce((a, i) => a + i.value, 0);
  return `<ul class="rank">${items.map(i => `<li class="rank-row" title="${escapeHtml(i.label)}: ${formatBRL(i.value)}">
    <span class="rank-label">${escapeHtml(i.label)}</span>
    <span class="rank-track"><span class="rank-bar" style="width:${(i.value / max * 100).toFixed(1)}%;background:${color}"></span></span>
    <span class="rank-val">${formatBRL(i.value)}</span><span class="rank-share">${pctOf(i.value, total)}%</span></li>`).join('')}</ul>`;
}

// planejado × real: barra = pago (sólido) + a pagar (claro); traço = planejado
function bulletRows(items) {
  const max = Math.max(...items.map(i => Math.max(i.pago + i.aPagar, i.plan)), 1);
  return `<ul class="rank">${items.map(i => {
    const total = i.pago + i.aPagar, over = i.plan > 0 && total > i.plan + 0.005;
    const wP = (i.pago / max) * 100, wA = (i.aPagar / max) * 100, tick = (i.plan / max) * 100;
    const txt = i.plan > 0
      ? `${over ? icon('alert', 14) : ''}<b>${formatBRL(total)}</b> de ${formatBRL(i.plan)}`
      : `<b>${formatBRL(total)}</b> sem planejado`;
    return `<li class="bullet-row" title="${escapeHtml(i.label)}: ${formatBRL(total)} de ${formatBRL(i.plan)} planejados${over ? ' (acima do planejado)' : ''}">
      <span class="rank-label">${escapeHtml(i.label)}</span>
      <span class="bullet-track"><i style="width:${wP.toFixed(2)}%;background:var(--c-gastos)"></i><i style="width:${wA.toFixed(2)}%;background:color-mix(in srgb,var(--c-gastos) 38%,var(--surface))"></i>${i.plan > 0 ? `<span class="bullet-tick" style="left:${tick.toFixed(2)}%"></span>` : ''}</span>
      <span class="bullet-val ${over ? 'over' : ''}">${txt}${over ? ' · acima' : ''}</span></li>`;
  }).join('')}</ul>
  <div class="key-note"><span><i class="k-rect" style="background:var(--c-gastos)"></i>Pago</span><span><i class="k-rect" style="background:color-mix(in srgb,var(--c-gastos) 38%,var(--surface))"></i>A pagar</span><span><i class="k-tick"></i>Planejado</span></div>`;
}

// fita: cada real que entrou, repartido
function ribbonHtml(s) {
  const segs = [
    { key: 'pago', label: 'Pago', value: s.pago, color: 'var(--c-gastos)' },
    { key: 'aPagar', label: 'A pagar', value: s.aPagar, color: 'color-mix(in srgb,var(--c-gastos) 38%,var(--surface))' },
    { key: 'inv', label: 'Investido', value: s.investido, color: 'var(--c-invest)' },
    { key: 'livre', label: 'Livre', value: Math.max(0, s.ganhos - s.gastos - s.investido), color: 'var(--track)' },
  ];
  const outlay = s.gastos + s.investido;
  const denom = Math.max(s.ganhos, outlay, 1);
  const over = outlay > s.ganhos + 0.005 && s.ganhos > 0;
  const bars = segs.filter(x => x.value > 0).map(x => `<i style="width:${(x.value / denom * 100).toFixed(3)}%;background:${x.color}" title="${x.label}: ${formatBRL(x.value)}"></i>`).join('')
    || `<i style="width:100%;background:var(--track)"></i>`;
  const limit = over ? `<span class="limit" style="left:calc(${(s.ganhos / denom * 100).toFixed(2)}% - 1px)"><span>Ganhos</span></span>` : '';
  const legend = segs.map(x => `<div class="lg-item"><div class="lg-name"><span class="lg-key" style="background:${x.color}"></span>${x.label}</div>
      <div class="lg-val">${formatBRL(x.value)}</div><div class="lg-pct">${s.ganhos > 0 ? pctOf(x.value, s.ganhos) + '% dos ganhos' : '&nbsp;'}</div></div>`).join('');
  return `<div class="ribbon-wrap"><div class="ribbon" role="img" aria-label="Distribuição dos ganhos entre pago, a pagar, investido e livre" style="${over ? 'margin-top:22px' : ''}">${bars}${limit}</div>
    <div class="ribbon-legend">${legend}</div></div>`;
}

/* ============================================================
   TELAS
   ============================================================ */
const NAV = [
  ['resumo', 'Resumo', 'dashboard'],
  ['lancamentos', 'Gastos', 'receipt'],
  ['ganhos', 'Ganhos', 'wallet'],
  ['orcamento', 'Orçamento', 'target'],
  ['investimentos', 'Investimentos', 'trend'],
  ['categorias', 'Ajustes', 'sliders'],
];
const PERIOD_TABS = ['resumo', 'lancamentos', 'ganhos', 'investimentos'];

/* ---------- Estrutura geral ---------- */
function render() {
  const root = document.getElementById('root');
  if (authView !== 'ready' || !state.loaded) {
    destroyCharts(); pendingCharts = [];
    root.innerHTML = renderAuthScreen();
    attachAuthHandlers();
    return;
  }
  pendingCharts = [];
  root.innerHTML = `<div class="app">${renderRail()}<div class="main">${renderTopbar()}<main class="view" id="view" tabindex="-1">${renderView()}</main></div></div>`;
  mountCharts();
}
function rerenderView() {
  const v = document.getElementById('view');
  if (!v) return render();
  pendingCharts = [];
  v.innerHTML = renderView();
  mountCharts();
}
function renderView() {
  switch (state.ui.tab) {
    case 'lancamentos': return renderLancamentos();
    case 'ganhos': return renderGanhos();
    case 'orcamento': return renderOrcamento();
    case 'investimentos': return renderInvestimentos();
    case 'categorias': return renderAjustes();
    default: return renderResumo();
  }
}

function renderRail() {
  const email = currentUser ? currentUser.email : '';
  return `<aside class="rail">
    <div class="brand"><span class="logo">${LOGO}</span><span class="brand-name">Caderneta</span></div>
    <nav class="nav" aria-label="Principal">${NAV.map(([id, label, ic]) =>
      `<button type="button" class="nav-item" data-tab="${id}" ${state.ui.tab === id ? 'aria-current="page"' : ''}>${icon(ic, 20)}<span>${id === 'investimentos' ? '<span class="l-full">Investimentos</span><span class="l-short">Invest.</span>' : label}</span></button>`).join('')}</nav>
    <div class="rail-user">
      <div class="avatar" aria-hidden="true">${escapeHtml((email[0] || '?').toUpperCase())}</div>
      <div class="who"><span class="who-mail" title="${escapeHtml(email)}">${escapeHtml(email)}</span><span id="save-status" class="save-status ${saveStatus}">${saveStatusText()}</span></div>
      <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="${isDarkNow() ? 'Usar tema claro' : 'Usar tema escuro'}" title="${isDarkNow() ? 'Tema claro' : 'Tema escuro'}">${icon(isDarkNow() ? 'sun' : 'moon', 19)}</button>
      <button type="button" class="icon-btn" data-action="logout" aria-label="Sair" title="Sair">${icon('logout', 19)}</button>
    </div></aside>`;
}

function periodTitle() {
  const ui = state.ui;
  if (ui.rangeMode === 'month') { const [y, m] = ui.selectedMonth.split('-'); return `${MONTH_NAMES[+m - 1]} ${y}`; }
  if (ui.rangeMode === 'year') return ui.selectedYear;
  const keys = getActiveMonthKeys(), a = keys[0], b = keys[keys.length - 1];
  const la = MONTH_NAMES_SHORT[+a.slice(5) - 1], lb = MONTH_NAMES_SHORT[+b.slice(5) - 1];
  return a.slice(0, 4) === b.slice(0, 4) ? `${la} a ${lb} ${b.slice(0, 4)}` : `${la} ${a.slice(2, 4)} a ${lb} ${b.slice(2, 4)}`;
}

function renderTopbar() {
  const ui = state.ui;
  const withPeriod = PERIOD_TABS.includes(ui.tab);
  const pageName = (NAV.find(n => n[0] === ui.tab) || NAV[0])[1];
  const left = withPeriod
    ? `<div class="period"><button type="button" class="icon-btn round" data-action="period-prev" aria-label="Período anterior">${icon('left', 20)}</button>
        <h1 class="period-title"><span class="sr-only">${pageName}: </span>${escapeHtml(periodTitle())}</h1>
        <button type="button" class="icon-btn round" data-action="period-next" aria-label="Próximo período">${icon('right', 20)}</button></div>`
    : `<h1 class="page-title">${pageName}</h1>`;
  const nowKey = todayStr().slice(0, 7);
  const year = ui.selectedMonth.slice(0, 4);
  let filters = '';
  if (withPeriod) {
    const seg = `<div class="seg" role="group" aria-label="Tipo de período">${[['month', 'Mês'], ['range', 'Vários meses'], ['year', 'Ano']].map(([v, l]) =>
      `<button type="button" data-range-mode="${v}" aria-pressed="${ui.rangeMode === v}">${l}</button>`).join('')}</div>`;
    let extra = '';
    if (ui.rangeMode === 'month') {
      extra = `<div class="chips" role="group" aria-label="Meses de ${year}">${Array.from({ length: 12 }, (_, i) => {
        const mk = `${year}-${pad2(i + 1)}`;
        return `<button type="button" class="chip ${mk === nowKey ? 'now' : ''}" data-select-month="${mk}" aria-pressed="${ui.selectedMonth === mk}">${MONTH_NAMES_SHORT[i]}</button>`;
      }).join('')}</div>`;
    } else if (ui.rangeMode === 'range') {
      extra = `<div class="range-inputs"><label>De <input type="month" id="range-start" data-field="range-start" value="${ui.rangeStart}"></label>
        <label>até <input type="month" id="range-end" data-field="range-end" value="${ui.rangeEnd}"></label></div>`;
    }
    filters = `<div class="period-filters">${seg}${extra}</div>`;
  }
  return `<header class="topbar"><div class="topbar-inner">
    <div class="topbar-row">${left}
      <div class="topbar-actions"><div class="quick">
        <button type="button" class="btn primary" data-action="toggle-quick" aria-haspopup="menu" aria-expanded="false">${icon('plus', 18)}<span>Novo</span></button>
        <div class="menu" id="quick-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-action="quick-gasto">${icon('receipt', 18)}Gasto</button>
          <button type="button" role="menuitem" data-action="quick-ganho">${icon('wallet', 18)}Ganho</button>
          <button type="button" role="menuitem" data-action="quick-invest">${icon('trend', 18)}Investimento</button>
        </div></div></div></div>${filters}</div></header>`;
}

/* ---------- Painel simples ---------- */
function panel({ title, sub, span = 'span-12', body, tools = '' }) {
  return `<section class="panel ${span}"><div class="panel-head"><div><h2>${escapeHtml(title)}</h2>${sub ? `<p class="panel-sub">${escapeHtml(sub)}</p>` : ''}</div>${tools}</div>${body}</section>`;
}
function panelNote(text) { return `<div class="chart-empty">${escapeHtml(text)}</div>`; }

/* ============================================================
   RESUMO
   ============================================================ */
function dueBadges(e) {
  const d = daysFromToday(e.dataPagamento);
  if (d < 0) return `<span class="badge late">${icon('alert', 12)}Atrasado</span><span>${dayMonthBR(e.dataPagamento)}</span>`;
  if (d === 0) return `<span class="badge soon">Vence hoje</span>`;
  if (d <= 7) return `<span class="badge soon">Em ${d} ${d === 1 ? 'dia' : 'dias'}</span><span>${dayMonthBR(e.dataPagamento)}</span>`;
  return `<span>${dayMonthBR(e.dataPagamento)}</span>`;
}

function heroNote(s) {
  if (!s.ganhos && !s.gastos && !s.investido) return 'Registre ganhos e gastos para ver como está o período.';
  if (!s.ganhos) return 'Nenhum ganho registrado neste período.';
  const outlay = s.gastos + s.investido;
  if (outlay > s.ganhos + 0.005) return `<span>${icon('alert', 16)}Gastos e investimentos passam dos ganhos em ${formatBRL(outlay - s.ganhos)}.</span>`;
  const pct = pctOf(outlay, s.ganhos);
  return `Você já comprometeu ${pct}% dos ganhos${s.aPagar > 0 ? `, e ainda faltam ${formatBRL(s.aPagar)} a pagar` : ''}.`;
}

function renderResumo() {
  const keys = getActiveMonthKeys(), last = keys[keys.length - 1], single = keys.length === 1;
  const cur = periodStats(keys), prev = periodStats(prevPeriodKeys()), cmp = compareLabel();
  const prevLast = shiftMonthKey(last, -keys.length);
  const nothing = !state.expenses.length && !state.incomes.length && !state.investments.length;
  const trail = trailingKeys(last, 12), tS = trail.map(k => periodStats([k]));

  /* herói */
  const hero = `<section class="panel hero">
    <div><p class="hero-label">Sobra ${periodNoun()}</p>
      <p class="hero-figure ${cur.livre < -0.005 ? 'neg' : ''}">${moneyHtml(cur.livre)}</p>
      <p class="hero-note">${heroNote(cur)}</p></div>
    ${ribbonHtml(cur)}</section>`;

  /* indicadores */
  const nInv = state.investments.length;
  const kpi = (color, label, value, delta, foot, series) => `<div class="kpi"><div class="kpi-top"><span class="kpi-dot" style="background:${color}"></span>${label}</div>
    <div class="kpi-value">${formatBRL(value)}</div><div style="margin-top:6px">${delta}</div>
    <div class="kpi-foot"><span class="kpi-sub">${foot}</span>${sparkline(series, color)}</div></div>`;
  const kpis = `<section class="panel kpis" aria-label="Indicadores">
    ${kpi('var(--c-ganhos)', 'Ganhos', cur.ganhos, deltaChip(cur.ganhos, prev.ganhos, true, cmp), `${cur.nGanhos} ${cur.nGanhos === 1 ? 'lançamento' : 'lançamentos'}`, tS.map(s => s.ganhos))}
    ${kpi('var(--c-gastos)', 'Gastos', cur.gastos, deltaChip(cur.gastos, prev.gastos, false, cmp), cur.aPagar > 0 ? `${formatBRL(cur.aPagar)} ainda a pagar` : (cur.gastos > 0 ? 'Tudo pago' : 'Sem gastos'), tS.map(s => s.gastos))}
    ${kpi('var(--c-invest)', 'Investido', cur.investido, deltaChip(cur.investido, prev.investido, true, cmp), cur.rendimentos > 0 ? `${formatBRL(cur.rendimentos)} de rendimentos` : 'Aportes menos resgates', tS.map(s => s.investido))}
    ${kpi('var(--c-invest)', 'Patrimônio investido', patrimonioAt(last), deltaChip(patrimonioAt(last), patrimonioAt(prevLast), true, cmp), `${nInv} ${nInv === 1 ? 'investimento' : 'investimentos'}`, trail.map(patrimonioAt))}
  </section>`;

  if (nothing) {
    return `<div class="stack">${hero}${kpis}
      <section class="panel welcome"><h2>Por onde começar</h2><p>Registre o que entra e o que sai. Os gráficos aparecem assim que houver dados.</p>
        <div class="welcome-steps">
          <button type="button" data-action="open-income-modal"><span class="ico">${icon('wallet', 20)}</span><span>Registrar um ganho<small>Salário, aluguel, extras</small></span></button>
          <button type="button" data-action="open-expense-modal"><span class="ico">${icon('receipt', 20)}</span><span>Registrar um gasto<small>Com data de pagamento</small></span></button>
          <button type="button" data-tab="categorias"><span class="ico">${icon('sliders', 20)}</span><span>Ajustar categorias<small>Crie as suas</small></span></button>
        </div></section></div>`;
  }

  /* fluxo + ritmo */
  const { months } = fluxoMonths();
  const mStats = months.map(k => periodStats([k]));
  const hasFlux = mStats.some(s => s.ganhos || s.gastos);
  const tot = periodStats(keys);
  const fluxSub = single
    ? (cur.ganhos > 0 ? `Em ${monthNameOf(last).toLowerCase()} você gastou ${pctOf(cur.gastos, cur.ganhos)}% do que ganhou. Os outros meses ficam esmaecidos para comparar.` : 'Comparação com os 5 meses anteriores.')
    : `No período, ganhos de ${formatBRL(tot.ganhos)} e gastos de ${formatBRL(tot.gastos)}.`;
  const fluxo = hasFlux
    ? chartPanel({ id: 'fluxo', title: single ? 'Ganhos e gastos, mês a mês' : 'Ganhos e gastos por mês', sub: fluxSub, span: 'span-7',
        legend: [{ label: 'Ganhos', color: 'var(--c-ganhos)' }, { label: 'Gastos', color: 'var(--c-gastos)' }], build: fluxoConfig, table: fluxoTable })
    : panel({ title: 'Ganhos e gastos, mês a mês', span: 'span-7', body: panelNote('Sem movimentação nestes meses.') });

  let second;
  if (single) {
    const p = dailyPace(last);
    const realNow = [...p.real].reverse().find(v => v !== null) ?? 0;
    const planEnd = p.plan[p.days - 1];
    second = cur.nGastos
      ? chartPanel({ id: 'ritmo', title: 'Ritmo dos gastos no mês', span: 'span-5', short: false,
          sub: `Pago até agora: ${formatBRL(realNow)}. Previsto para o mês: ${formatBRL(planEnd)}.`,
          legend: [{ label: 'Previsto', color: 'var(--ink-3)', line: true }, { label: 'Real', color: 'var(--c-gastos)', line: true }], build: paceConfig, table: paceTable })
      : panel({ title: 'Ritmo dos gastos no mês', span: 'span-5', body: panelNote('Registre gastos neste mês para acompanhar o ritmo.') });
  } else {
    const acc = saldoSeries();
    second = chartPanel({ id: 'saldo', title: 'Sobra acumulada', span: 'span-5', sub: `Soma da sobra mês a mês: ${formatBRL(acc[acc.length - 1])}.`, build: saldoConfig, table: saldoTable });
  }

  /* categorias + planejado × real */
  const byCat = groupExpenses(keys, e => e.categoria);
  const catItems = topWithOthers(byCat, 8).map(g => ({ label: g.label, value: g.total }));
  const catPanel = byCat.length
    ? panel({ title: 'Para onde foi o dinheiro', span: 'span-6',
        sub: `${byCat[0].label} lidera com ${pctOf(byCat[0].total, cur.gastos)}% dos gastos.`,
        body: rankBars(catItems, 'var(--c-gastos)') })
    : panel({ title: 'Para onde foi o dinheiro', span: 'span-6', body: panelNote('Sem gastos neste período.') });
  const over = byCat.filter(g => g.plan > 0 && g.total > g.plan + 0.005).length;
  const planPanel = byCat.length
    ? panel({ title: 'Planejado e real por categoria', span: 'span-6',
        sub: over ? `${over} ${over === 1 ? 'categoria passou' : 'categorias passaram'} do planejado.` : 'Tudo dentro do planejado.',
        body: bulletRows(topWithOthers(byCat, 8)) })
    : panel({ title: 'Planejado e real por categoria', span: 'span-6', body: panelNote('Sem gastos neste período.') });

  /* como foi pago + patrimônio */
  const by = ['metodo', 'tipo', 'conta'].includes(state.ui.breakdownBy) ? state.ui.breakdownBy : 'metodo';
  const getKey = by === 'metodo' ? (e => e.metodoPagamento) : by === 'tipo' ? (e => e.tipo) : (e => e.conta || 'Sem conta');
  const grp = topWithOthers(groupExpenses(keys, getKey), 6).map(g => ({ label: g.label, value: g.total }));
  const brk = panel({ title: 'Como foi pago', span: 'span-5',
    tools: `<div class="seg" role="group" aria-label="Agrupar por">${[['metodo', 'Forma'], ['tipo', 'Tipo'], ['conta', 'Conta']].map(([v, l]) => `<button type="button" data-breakdown="${v}" aria-pressed="${by === v}">${l}</button>`).join('')}</div>`,
    body: grp.length ? rankBars(grp, 'var(--c-gastos)') : panelNote('Sem gastos neste período.') });
  const patr = nInv
    ? chartPanel({ id: 'patrimonio', title: 'Patrimônio investido', span: 'span-7', sub: `Hoje: ${formatBRL(patrimonioAt(last))}. Últimos 12 meses.`, build: patrimonioConfig, table: patrimonioTable })
    : panel({ title: 'Patrimônio investido', span: 'span-7', body: emptyState('trend', 'Nenhum investimento ainda', 'Cadastre CDB, poupança e outros para acompanhar o patrimônio ao longo do tempo.', '<button type="button" class="btn" data-action="open-investment-modal">Cadastrar investimento</button>') });

  /* para pagar + maiores gastos */
  const pend = pendingExpenses(keys);
  const pendSum = pend.reduce((a, e) => a + plannedAmount(e), 0);
  const pendPanel = panel({ title: 'Para pagar', span: 'span-6',
    sub: pend.length ? `${pend.length} ${pend.length === 1 ? 'pendente' : 'pendentes'}, somando ${formatBRL(pendSum)}.` : '',
    body: pend.length
      ? `<ul class="list">${pend.slice(0, 7).map(e => `<li class="item">
          <button type="button" class="check" data-action="mark-paid" data-id="${e.id}" aria-label="Marcar ${escapeHtml(e.descricao)} como pago" title="Marcar como pago">${icon('check', 16)}</button>
          <div class="item-main"><div class="item-title">${escapeHtml(e.descricao)}</div><div class="item-sub">${dueBadges(e)}</div></div>
          <div class="item-amt">${formatBRL(plannedAmount(e))}</div></li>`).join('')}</ul>
        ${pend.length > 7 ? `<div class="more"><button type="button" class="btn small" data-action="goto-pending">Ver os ${pend.length} em Gastos</button></div>` : ''}`
      : emptyState('check', 'Nada pendente', 'Todos os gastos deste período estão pagos.') });
  const tops = topExpenses(keys, 6);
  const topPanel = panel({ title: 'Maiores gastos', span: 'span-6',
    body: tops.length ? `<ul class="list">${tops.map(e => `<li class="item"><div class="item-main"><div class="item-title">${escapeHtml(e.descricao)}</div>
        <div class="item-sub"><span>${escapeHtml(e.categoria)}</span><span>${dayMonthBR(e.dataPagamento)}</span></div></div>
        <div class="item-amt">${formatBRL(expenseAmount(e))}</div></li>`).join('')}</ul>` : panelNote('Sem gastos neste período.') });

  return `<div class="stack">${hero}${kpis}
    <div class="grid">${fluxo}${second}${catPanel}${planPanel}${brk}${patr}${pendPanel}${topPanel}</div></div>`;
}

/* ============================================================
   GASTOS
   ============================================================ */
function lancFiltered() {
  const f = state.ui.lancamentosFilter;
  let list = expensesInPeriod();
  if (f.categoria) list = list.filter(e => e.categoria === f.categoria);
  if (f.tipo) list = list.filter(e => e.tipo === f.tipo);
  if (f.status === 'pago') list = list.filter(isPaid);
  else if (f.status === 'apagar') list = list.filter(e => !isPaid(e));
  else if (f.status === 'atrasado') list = list.filter(isOverdue);
  if (f.busca) { const q = f.busca.toLowerCase(); list = list.filter(e => (e.descricao || '').toLowerCase().includes(q) || (e.categoria || '').toLowerCase().includes(q)); }
  return list.sort((a, b) => b.dataPagamento.localeCompare(a.dataPagamento) || (b.criadoEm || 0) - (a.criadoEm || 0));
}

function renderLancamentos() {
  const f = state.ui.lancamentosFilter;
  const statusBtns = [['', 'Todos'], ['apagar', 'A pagar'], ['pago', 'Pagos'], ['atrasado', 'Atrasados']]
    .map(([v, l]) => `<button type="button" data-filter-status="${v}" aria-pressed="${(f.status || '') === v}">${l}</button>`).join('');
  return `<div class="stack">
    <div class="toolbar">
      <label class="search">${icon('search', 18)}<input type="search" id="lanc-busca" placeholder="Buscar gasto" value="${escapeHtml(f.busca)}" aria-label="Buscar gasto"></label>
      <select id="lanc-categoria" aria-label="Categoria"><option value="">Todas as categorias</option>${optionsHtml(state.config.categoriasGastos, f.categoria)}</select>
      <select id="lanc-tipo" aria-label="Tipo"><option value="">Todos os tipos</option>${optionsHtml(TIPOS_LANCAMENTO, f.tipo)}</select>
      <div class="seg" role="group" aria-label="Situação">${statusBtns}</div>
      <span class="grow"></span>
      <button type="button" class="btn primary" data-action="open-expense-modal">${icon('plus', 18)}Novo gasto</button>
    </div>
    <div id="results" class="stack">${renderLancResults()}</div></div>`;
}

function renderLancResults() {
  const list = lancFiltered();
  const multi = getActiveMonthKeys().length > 1;
  let plan = 0, pago = 0, aPagar = 0, atr = 0, nAtr = 0;
  list.forEach(e => { plan += plannedAmount(e); if (isPaid(e)) pago += paidAmount(e); else { aPagar += plannedAmount(e); if (isOverdue(e)) { atr += plannedAmount(e); nAtr++; } } });
  const summary = `<section class="panel summary" aria-label="Totais da lista">
    <div><div class="s-label">Planejado</div><div class="s-val">${formatBRL(plan)}</div><div class="s-sub">${list.length} ${list.length === 1 ? 'gasto' : 'gastos'}</div></div>
    <div><div class="s-label">Pago</div><div class="s-val">${formatBRL(pago)}</div><div class="s-sub">${plan > 0 ? pctOf(pago, plan) + '% do planejado' : '&nbsp;'}</div></div>
    <div><div class="s-label">A pagar</div><div class="s-val">${formatBRL(aPagar)}</div><div class="s-sub">${list.filter(e => !isPaid(e)).length} pendentes</div></div>
    <div><div class="s-label">Atrasado</div><div class="s-val" style="${nAtr ? 'color:var(--bad-text)' : ''}">${formatBRL(atr)}</div><div class="s-sub">${nAtr ? `${nAtr} ${nAtr === 1 ? 'gasto' : 'gastos'}` : 'Nenhum atrasado'}</div></div></section>`;

  if (!list.length) {
    const filtered = state.ui.lancamentosFilter.busca || state.ui.lancamentosFilter.categoria || state.ui.lancamentosFilter.tipo || state.ui.lancamentosFilter.status;
    return `${summary}<section class="panel">${filtered
      ? emptyState('search', 'Nada encontrado', 'Nenhum gasto combina com esses filtros neste período.', '<button type="button" class="btn" data-action="clear-filters">Limpar filtros</button>')
      : emptyState('receipt', 'Nenhum gasto neste período', 'Registre o primeiro gasto, com a data em que ele será pago.', '<button type="button" class="btn primary" data-action="open-expense-modal">Novo gasto</button>')}</section>`;
  }

  const shown = list.slice(0, state.ui.lancLimit);
  let lastMk = null, rows = '';
  shown.forEach(e => {
    const mk = monthKey(e.dataPagamento);
    if (multi && mk !== lastMk) {
      const tot = list.filter(x => monthKey(x.dataPagamento) === mk).reduce((a, x) => a + expenseAmount(x), 0);
      rows += `<tr class="group"><td colspan="9"><div class="row-between" style="margin:0;padding:0;border:0"><span>${monthNameOf(mk)} ${mk.slice(0, 4)}</span><span class="num">${formatBRL(tot)}</span></div></td></tr>`;
      lastMk = mk;
    }
    const paid = isPaid(e), late = isOverdue(e);
    const parcela = e.parcelaTotal ? `<span class="badge">${e.parcelaAtual}/${e.parcelaTotal}</span>` : '';
    const restit = e.restituido ? '<span class="badge">Restituído</span>' : '';
    const lateB = late ? `<span class="badge late">${icon('alert', 12)}Atrasado</span>` : '';
    rows += `<tr class="row ${paid ? 'is-paid' : ''}" data-id="${e.id}" data-kind="expense">
      <td class="c-check"><button type="button" class="check ${paid ? 'on' : ''}" data-action="toggle-paid" data-id="${e.id}" aria-label="${paid ? 'Marcar como a pagar' : 'Marcar como pago'}" title="${paid ? 'Marcar como a pagar' : 'Marcar como pago'}">${icon('check', 16)}</button></td>
      <td class="c-desc"><div class="desc">${escapeHtml(e.descricao)} ${parcela} ${restit}</div>
        <div class="m-only m-meta"><span>${escapeHtml(e.categoria)}</span><span>${dayMonthBR(e.dataPagamento)}</span>${lateB}</div></td>
      <td class="c-cat"><span class="cat">${escapeHtml(e.categoria)}</span></td>
      <td class="c-pay">${escapeHtml(e.metodoPagamento)}${e.conta ? `<div class="muted" style="font-size:12.5px">${escapeHtml(e.conta)}</div>` : ''}</td>
      <td class="c-date">${dayMonthBR(e.dataPagamento)} ${lateB}</td>
      <td class="r c-est">${formatBRL(plannedAmount(e))}</td>
      <td class="r c-real">${paid ? formatBRL(paidAmount(e)) : '<span class="muted">—</span>'}</td>
      <td class="c-amt" style="${paid ? '' : 'color:var(--ink-2);font-weight:600'}">${formatBRL(expenseAmount(e))}</td>
      <td class="acts"><button type="button" class="icon-btn sm" data-action="edit-expense" data-id="${e.id}" aria-label="Editar ${escapeHtml(e.descricao)}">${icon('pencil', 16)}</button><button type="button" class="icon-btn sm" data-action="delete-expense" data-id="${e.id}" aria-label="Excluir ${escapeHtml(e.descricao)}">${icon('trash', 16)}</button></td></tr>`;
  });
  return `${summary}<section class="panel" style="padding:8px 14px 14px"><table class="tbl"><thead><tr>
      <th style="width:48px"><span class="sr-only">Pago</span></th><th>Descrição</th><th>Categoria</th><th>Pagamento</th><th>Data</th><th class="r">Planejado</th><th class="r">Real</th><th class="r" style="width:76px"></th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${list.length > shown.length ? `<div class="more"><button type="button" class="btn" data-action="more-lanc">Mostrar mais (${list.length - shown.length})</button></div>` : ''}</section>`;
}

function renderGanhos() {
  const f = state.ui.ganhosFilter;
  return `<div class="stack">
    <div class="toolbar">
      <label class="search">${icon('search', 18)}<input type="search" id="ganho-busca" placeholder="Buscar ganho" value="${escapeHtml(f.busca)}" aria-label="Buscar ganho"></label>

      <button type="button" class="btn primary" data-action="open-income-modal">${icon('plus', 18)}Novo ganho</button>
    </div>
    <div id="results">${renderGanhosResults()}</div></div>`;
}
function renderGanhosResults() {
  const f = state.ui.ganhosFilter;
  let list = incomesInPeriod();
  if (f.busca) { const q = f.busca.toLowerCase(); list = list.filter(i => (i.descricao || '').toLowerCase().includes(q) || (i.categoria || '').toLowerCase().includes(q)); }
  list.sort((a, b) => b.dataPagamento.localeCompare(a.dataPagamento) || (b.criadoEm || 0) - (a.criadoEm || 0));
  const sum = (arr) => arr.reduce((a, i) => a + N(i.valor), 0);
  const total = sum(list), fixo = sum(list.filter(i => i.tipo === 'Fixo')), outros = total - fixo;
  const summary = `<section class="panel summary" aria-label="Totais">
    <div><div class="s-label">Total recebido</div><div class="s-val">${formatBRL(total)}</div><div class="s-sub">${list.length} ${list.length === 1 ? 'lançamento' : 'lançamentos'}</div></div>
    <div><div class="s-label">Fixos</div><div class="s-val">${formatBRL(fixo)}</div><div class="s-sub">${pctOf(fixo, total)}% do total</div></div>
    <div><div class="s-label">Pontuais e extras</div><div class="s-val">${formatBRL(outros)}</div><div class="s-sub">${pctOf(outros, total)}% do total</div></div>
    <div><div class="s-label">Média por mês</div><div class="s-val">${formatBRL(total / Math.max(1, getActiveMonthKeys().length))}</div><div class="s-sub">&nbsp;</div></div></section>`;
  if (!list.length) {
    return `<div class="stack">${summary}<section class="panel">${f.busca
      ? emptyState('search', 'Nada encontrado', 'Nenhum ganho combina com essa busca neste período.')
      : emptyState('wallet', 'Nenhum ganho neste período', 'Registre salário, aposentadoria, aluguéis recebidos e outras entradas.', '<button type="button" class="btn primary" data-action="open-income-modal">Novo ganho</button>')}</section></div>`;
  }
  const cats = groupIncomes(getActiveMonthKeys(), i => i.categoria);
  const rows = list.map(i => `<tr class="row" data-id="${i.id}" data-kind="income">
      <td class="c-check"><span class="check on" style="background:var(--c-ganhos);border-color:var(--c-ganhos);pointer-events:none">${icon('downarrow', 15)}</span></td>
      <td class="c-desc"><div class="desc">${escapeHtml(i.descricao)} ${i.tipo === 'Fixo' ? '<span class="badge">Fixo</span>' : ''}</div>
        <div class="m-only m-meta"><span>${escapeHtml(i.categoria)}</span><span>${dayMonthBR(i.dataPagamento)}</span></div></td>
      <td class="c-cat"><span class="cat">${escapeHtml(i.categoria)}</span></td>
      <td class="c-pay">${escapeHtml(i.tipo)}</td>
      <td class="c-date">${dayMonthBR(i.dataPagamento)}</td>
      <td class="r c-real"><b>${formatBRL(i.valor)}</b></td>
      <td class="c-amt">${formatBRL(i.valor)}</td>
      <td class="acts"><button type="button" class="icon-btn sm" data-action="edit-income" data-id="${i.id}" aria-label="Editar ${escapeHtml(i.descricao)}">${icon('pencil', 16)}</button><button type="button" class="icon-btn sm" data-action="delete-income" data-id="${i.id}" aria-label="Excluir ${escapeHtml(i.descricao)}">${icon('trash', 16)}</button></td></tr>`).join('');
  return `<div class="stack">${summary}<div class="grid">
    <section class="panel span-8" style="padding:8px 14px 14px"><table class="tbl"><thead><tr><th style="width:48px"></th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Data</th><th class="r">Valor</th><th style="width:76px"></th></tr></thead><tbody>${rows}</tbody></table></section>
    ${panel({ title: 'De onde vem', span: 'span-4', sub: cats.length ? `${cats[0].label} responde por ${pctOf(cats[0].total, total)}% dos ganhos.` : '', body: rankBars(topWithOthers(cats, 7).map(c => ({ label: c.label, value: c.total })), 'var(--c-ganhos)') })}
  </div></div>`;
}

/* ============================================================
   ORÇAMENTO
   ============================================================ */
function budgetInput(cat, mk) {
  const v = budgetFor(mk, cat);
  return `<div class="money"><span>R$</span><input type="text" class="budget-input" data-cat="${escapeHtml(cat)}" inputmode="decimal" aria-label="Orçamento de ${escapeHtml(cat)}" value="${v ? v.toFixed(2).replace('.', ',') : ''}" placeholder="0,00"></div>`;
}
function renderOrcamento() {
  const mk = state.ui.orcamentoMonth;
  const split = budgetSplit(mk);
  const cats = state.config.categoriasGastos;
  const budgeted = [...new Set([...cats, ...state.budgets.filter(b => b.mes === mk).map(b => b.categoria)])].filter(c => budgetFor(mk, c) > 0)
    .sort((a, b) => budgetFor(mk, b) - budgetFor(mk, a));
  const spentNoBudget = Object.keys(split).filter(c => !budgeted.includes(c) && split[c].total > 0).sort((a, b) => split[b].total - split[a].total);
  const rest = cats.filter(c => !budgeted.includes(c) && !spentNoBudget.includes(c));
  const orcado = budgeted.reduce((a, c) => a + budgetFor(mk, c), 0);
  const gasto = budgeted.reduce((a, c) => a + (split[c] ? split[c].total : 0), 0);
  const gastoSem = spentNoBudget.reduce((a, c) => a + split[c].total, 0);
  const pct = pctOf(gasto, orcado), overAll = gasto > orcado + 0.005;
  const [y, m] = mk.split('-');

  const meterW = orcado > 0 ? Math.min(100, (gasto / orcado) * 100) : 0;
  const head = `<section class="panel">
    <div class="row-between" style="margin:0;padding:0;border:0">
      <div class="stepper"><button type="button" class="icon-btn round" data-action="budget-prev" aria-label="Mês anterior">${icon('left', 20)}</button><b>${MONTH_NAMES[+m - 1]} ${y}</b><button type="button" class="icon-btn round" data-action="budget-next" aria-label="Próximo mês">${icon('right', 20)}</button></div>
      <button type="button" class="btn small" data-action="copy-budget-prev">Copiar do mês anterior</button></div>
    <div style="margin-top:22px">
      ${orcado > 0 ? `<p class="hero-label">${overAll ? 'Passou do orçado' : 'Ainda dá para gastar'}</p>
        <p class="hero-figure ${overAll ? 'neg' : ''}" style="font-size:clamp(34px,5vw,48px)">${moneyHtml(orcado - gasto)}</p>
        <div class="meter" style="margin-top:16px" role="img" aria-label="${pct}% do orçamento usado"><i style="width:${meterW.toFixed(2)}%;background:${overAll ? 'var(--bad-text)' : 'var(--c-gastos)'}"></i></div>
        <p class="panel-sub" style="margin-top:10px">${formatBRL(gasto)} gastos de ${formatBRL(orcado)} orçados (${pct}%).${gastoSem > 0 ? ` Mais ${formatBRL(gastoSem)} em categorias sem orçamento.` : ''}</p>`
        : `<p class="hero-note" style="margin:0">Defina quanto pretende gastar em cada categoria neste mês e acompanhe o consumo aqui.</p>`}
    </div></section>`;

  const barRow = (c) => {
    const g = split[c] || { pago: 0, aPagar: 0, total: 0 }, b = budgetFor(mk, c), over = g.total > b + 0.005;
    const max = Math.max(b, g.total, 1);
    return `<div class="budget-row"><span class="rank-label" style="font-weight:600">${escapeHtml(c)}</span>${budgetInput(c, mk)}
      <div class="bullet-track"><i style="width:${(g.pago / max * 100).toFixed(2)}%;background:var(--c-gastos)"></i><i style="width:${(g.aPagar / max * 100).toFixed(2)}%;background:color-mix(in srgb,var(--c-gastos) 38%,var(--surface))"></i><span class="bullet-tick" style="left:${(b / max * 100).toFixed(2)}%"></span></div>
      <span class="bullet-val ${over ? 'over' : ''}">${over ? icon('alert', 14) : ''}<b>${formatBRL(g.total)}</b> de ${formatBRL(b)}${over ? ` · +${formatBRL(g.total - b)}` : ''}</span></div>`;
  };
  const plainRow = (c, withSpend) => `<div class="budget-row" style="grid-template-columns:minmax(110px,1.1fr) 150px minmax(120px,2fr) 250px"><span class="rank-label" style="font-weight:600">${escapeHtml(c)}</span>${budgetInput(c, mk)}<span class="bullet-val" style="text-align:left">${withSpend ? `${formatBRL(split[c].total)} gastos, sem orçamento` : ''}</span></div>`;

  const list = budgeted.length ? `<section class="panel"><div class="panel-head"><div><h2>Categorias com orçamento</h2><p class="panel-sub">Barra cheia: pago. Barra clara: a pagar. Traço: o orçamento.</p></div></div>${budgeted.map(barRow).join('')}</section>` : '';
  const folds = `${spentNoBudget.length ? `<details class="fold panel" open style="margin-top:0"><summary>${icon('down', 16)}Gastos sem orçamento (${spentNoBudget.length})</summary>${spentNoBudget.map(c => plainRow(c, true)).join('')}</details>` : ''}
    ${rest.length ? `<details class="fold panel" style="margin-top:0"><summary>${icon('down', 16)}Outras categorias (${rest.length})</summary>${rest.map(c => plainRow(c, false)).join('')}</details>` : ''}`;
  return `<div class="stack">${head}${list}${folds}</div>`;
}

function renderInvestimentos() {
  const keys = getActiveMonthKeys(), last = keys[keys.length - 1];
  const s = periodStats(keys);
  const invs = [...state.investments].sort((a, b) => investmentBalance(b) - investmentBalance(a));
  const patrim = patrimonioAt(last);
  const summary = `<section class="panel summary" aria-label="Resumo dos investimentos">
    <div><div class="s-label">Patrimônio no fim do período</div><div class="s-val">${formatBRL(patrim)}</div><div class="s-sub">${invs.length} ${invs.length === 1 ? 'investimento' : 'investimentos'}</div></div>
    <div><div class="s-label">Aportes no período</div><div class="s-val">${formatBRL(s.aportes)}</div><div class="s-sub">&nbsp;</div></div>
    <div><div class="s-label">Resgates no período</div><div class="s-val">${formatBRL(s.resgates)}</div><div class="s-sub">&nbsp;</div></div>
    <div><div class="s-label">Rendimentos no período</div><div class="s-val">${formatBRL(s.rendimentos)}</div><div class="s-sub">&nbsp;</div></div></section>`;
  if (!invs.length) {
    return `<div class="stack">${summary}<section class="panel">${emptyState('trend', 'Nenhum investimento cadastrado', 'Cadastre CDB, poupança, tesouro e outros. Depois registre aportes, resgates e rendimentos.', '<button type="button" class="btn primary" data-action="open-investment-modal">Cadastrar investimento</button>')}</section></div>`;
  }
  const byTipo = {};
  invs.forEach(i => { byTipo[i.tipo] = (byTipo[i.tipo] || 0) + investmentBalance(i); });
  const tipoItems = topWithOthers(Object.entries(byTipo).map(([label, total]) => ({ label, total })).filter(x => x.total > 0).sort((a, b) => b.total - a.total), 6).map(x => ({ label: x.label, value: x.total }));
  const cards = invs.map(inv => {
    const bal = investmentBalance(inv);
    const movs = [...(inv.movimentacoes || [])].sort((a, b) => b.data.localeCompare(a.data));
    return `<section class="panel inv-card">
      <div class="inv-head"><div class="inv-mark" aria-hidden="true">${escapeHtml((inv.tipo || '?')[0])}</div>
        <div class="inv-title"><b>${escapeHtml(inv.descricao || inv.tipo)}</b><span class="muted">${escapeHtml(inv.tipo)}${inv.instituicao ? ', ' + escapeHtml(inv.instituicao) : ''}</span></div>
        <div class="inv-bal">${formatBRL(bal)}</div>
        <div class="inv-acts">
          <button type="button" class="btn small" data-action="add-movimentacao" data-id="${inv.id}" data-tipo="Aporte">Aportar</button>
          <button type="button" class="btn small" data-action="add-movimentacao" data-id="${inv.id}" data-tipo="Resgate">Resgatar</button>
          <button type="button" class="icon-btn sm" data-action="add-movimentacao" data-id="${inv.id}" data-tipo="Rendimento" aria-label="Registrar rendimento" title="Registrar rendimento">${icon('trend', 16)}</button>
          <button type="button" class="icon-btn sm" data-action="edit-investment" data-id="${inv.id}" aria-label="Editar investimento">${icon('pencil', 16)}</button>
          <button type="button" class="icon-btn sm" data-action="delete-investment" data-id="${inv.id}" aria-label="Excluir investimento">${icon('trash', 16)}</button></div></div>
      <details class="inv-body"><summary>${movs.length} ${movs.length === 1 ? 'movimentação' : 'movimentações'}</summary>
        ${movs.map(m => `<div class="mov"><span><span class="badge ${m.tipo === 'Resgate' ? 'late' : ''}">${m.tipo}</span></span><span>${fmtDateBR(m.data)}</span><span class="muted">${escapeHtml(m.observacao || '')}</span>
          <b class="num" style="${m.tipo === 'Resgate' ? 'color:var(--bad-text)' : ''}">${m.tipo === 'Resgate' ? '−' : ''}${formatBRL(m.valor)}</b>
          <button type="button" class="icon-btn sm" data-action="delete-movimentacao" data-invid="${inv.id}" data-movid="${m.id}" aria-label="Excluir movimentação">${icon('trash', 15)}</button></div>`).join('')}</details></section>`;
  }).join('');
  return `<div class="stack">${summary}<div class="grid">
    ${chartPanel({ id: 'patrimonio', title: 'Evolução do patrimônio', span: 'span-7', sub: `Hoje: ${formatBRL(patrim)}. Últimos 12 meses até o fim do período.`, build: patrimonioConfig, table: patrimonioTable })}
    ${panel({ title: 'Distribuição por tipo', span: 'span-5', body: tipoItems.length ? rankBars(tipoItems, 'var(--c-invest)') : panelNote('Sem saldo investido.') })}</div>
    <div class="row-between" style="margin:8px 0 -4px;padding:0;border:0"><h2 style="font-size:16px">Seus investimentos</h2><button type="button" class="btn small" data-action="open-investment-modal">${icon('plus', 16)}Novo investimento</button></div>
    ${cards}</div>`;
}

/* ============================================================
   FORMULÁRIOS (gaveta lateral)
   ============================================================ */
const fieldVal = (v) => (v !== null && v !== undefined && v !== '' ? String(v).replace('.', ',') : '');
const fld = (label, inner, extra = '') => `<div class="field ${extra}"><label>${label}</label>${inner}</div>`;
function setFieldError(form, name, msg) {
  const el = form.querySelector(`[name="${name}"]`);
  if (!el) return;
  const box = el.closest('.field');
  box.classList.add('has-error');
  let m = box.querySelector('.err');
  if (!m) { m = document.createElement('div'); m.className = 'err'; m.setAttribute('role', 'alert'); box.appendChild(m); }
  m.textContent = msg;
  el.focus();
}
function clearErrors(form) {

function defaultDateForNew() {
  const ui = state.ui, t = todayStr();
  if (ui.rangeMode === 'month' && ui.selectedMonth !== t.slice(0, 7)) return ui.selectedMonth + '-01';
  return t;
}
function syncExpenseForm() {
  const form = document.getElementById('expense-form');
  if (!form) return;
  const paid = form.querySelector('[name="status"]:checked').value === 'Pago';
  const rw = document.getElementById('real-wrap');
  if (rw) rw.hidden = !paid;
  const chk = document.getElementById('chk-parcelado');
  const pf = document.getElementById('parcelamento-fields');
  if (chk && pf) {
    pf.hidden = !chk.checked;
    const total = parseInt(document.getElementById('parc-total').value, 10) || 0;
    const vt = parseNumberInput(document.getElementById('parc-valor-total').value) || 0;
    const prev = document.getElementById('parc-preview');
    const date = form.querySelector('[name="dataPagamento"]').value;
    if (chk.checked && prev) {
      if (total >= 2 && vt > 0 && date) {
        const pv = Math.round((vt / total) * 100) / 100;
        prev.innerHTML = `<b>${total}× de ${formatBRL(pv)}</b><br>De ${fmtDateBR(date)} até ${fmtDateBR(addMonths(date, total - 1))}, uma parcela por mês.`;
      } else prev.textContent = 'Informe o número de parcelas e o valor total para ver a divisão.';
    }
    const est = document.getElementById('f-estimado');
    if (est) est.closest('.field').style.display = chk.checked ? 'none' : '';
  }
}
function submitExpense(form) {
  clearErrors(form);
  const fd = new FormData(form);
  const descricao = (fd.get('descricao') || '').trim();
  const data = fd.get('dataPagamento');
  const editId = form.dataset.editId;
  const chk = document.getElementById('chk-parcelado');
  const parcelado = !!(chk && chk.checked);
  let ok = true;
  if (!descricao) { setFieldError(form, 'descricao', 'Dê um nome ao gasto.'); ok = false; }
  if (!data) { setFieldError(form, 'dataPagamento', 'Informe a data de pagamento.'); ok = false; }
  let estimado = parseNumberInput(fd.get('valorEstimado'));
  const status = fd.get('status');
  let real = status === 'Pago' ? parseNumberInput(fd.get('valorReal')) : null;
  if (!parcelado && estimado === null && real === null) { setFieldError(form, 'valorEstimado', 'Informe o valor do gasto.'); ok = false; }
  if (parcelado) {
    const vt = parseNumberInput(document.getElementById('parc-valor-total').value);
    const n = parseInt(document.getElementById('parc-total').value, 10);
    if (!(n >= 2 && n <= 60)) { ok = false; showToast('Use entre 2 e 60 parcelas.'); }
    else if (!(vt > 0)) { ok = false; showToast('Informe o valor total da compra.'); }
  }
  if (!ok) return;
  const base = {
    descricao, categoria: fd.get('categoria'), tipo: fd.get('tipo'), metodoPagamento: fd.get('metodoPagamento'),
    conta: fd.get('conta') || '', dataPagamento: data, restituido: fd.get('restituido') === 'on', observacao: fd.get('observacao') || '',
  };
  if (parcelado) {
    const total = parseInt(document.getElementById('parc-total').value, 10);
    const vt = parseNumberInput(document.getElementById('parc-valor-total').value);
    const pv = Math.round((vt / total) * 100) / 100;
    const grupo = uid();
    for (let i = 0; i < total; i++) {
      const pago = i === 0 && status === 'Pago';
      addExpense({ id: uid(), ...base, dataPagamento: addMonths(data, i), valorEstimado: pv, valorReal: pago ? pv : null,
        status: pago ? 'Pago' : 'Previsto', parcelaAtual: i + 1, parcelaTotal: total, grupoParcelaId: grupo, criadoEm: Date.now() });
    }
    showToast(`${total} parcelas de ${formatBRL(pv)} criadas.`);
  } else {
    // valor real preenchido => pago; pago sem valor real => usa o previsto
    const patch = { ...base, valorEstimado: estimado !== null ? estimado : real, valorReal: real, status: status === 'Pago' || real !== null ? 'Pago' : 'Previsto' };
    if (patch.status === 'Pago' && patch.valorReal === null) patch.valorReal = patch.valorEstimado;
    if (editId) { updateExpense(editId, patch); showToast('Gasto salvo.'); }
    else { addExpense({ id: uid(), ...patch, parcelaAtual: null, parcelaTotal: null, grupoParcelaId: null, criadoEm: Date.now() }); showToast('Gasto adicionado.'); }
  }
  closeDrawer(); render();
}

/* ---------- Backup ---------- */
function exportData() {
  const payload = { expenses: state.expenses, incomes: state.incomes, investments: state.investments, budgets: state.budgets, config: state.config, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `caderneta-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup baixado.');
}
function importData(ev) {
  const input = ev.target, file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm('Importar substitui todos os dados atuais. Continuar?')) { input.value = ''; return; }
      state.expenses = data.expenses || [];
      state.incomes = data.incomes || [];
      state.investments = data.investments || [];
      state.budgets = data.budgets || [];
      state.config = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_CONFIG)), data.config || {});
      await Promise.all(['expenses', 'incomes', 'investments', 'budgets', 'config'].map(k => saveNow(k)));
      render();
      showToast('Dados importados.');
    } catch (e) {
      console.error(e);
      showToast('Não foi possível importar: arquivo inválido ou erro ao salvar.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* ============================================================
   EVENTOS (delegados) E INICIALIZAÇÃO
   ============================================================ */
function shiftPeriod(dir) {
  const ui = state.ui;
  if (ui.rangeMode === 'month') ui.selectedMonth = shiftMonthKey(ui.selectedMonth, dir);
  else if (ui.rangeMode === 'year') ui.selectedYear = String(Number(ui.selectedYear) + dir);
  else {
    const n = getActiveMonthKeys().length;
    ui.rangeStart = shiftMonthKey(ui.rangeStart, dir * n);
    ui.rangeEnd = shiftMonthKey(ui.rangeEnd, dir * n);
  }
  ui.lancLimit = 100;
  render();
}
function closeQuickMenu() {
  const m = document.getElementById('quick-menu');
  if (m) m.hidden = true;
  const b = document.querySelector('[data-action="toggle-quick"]');
  if (b) b.setAttribute('aria-expanded', 'false');
}
function findById(list, id) { return state[list].find(x => x.id === id); }

function markPaid(id, paid) {
  const e = findById('expenses', id);
  if (!e) return;
  const before = { status: e.status, valorReal: e.valorReal };
  if (paid) updateExpense(id, { status: 'Pago', valorReal: hasNum(e.valorReal) ? e.valorReal : plannedAmount(e) });
  else updateExpense(id, { status: 'Previsto', valorReal: null });
  rerenderAfterChange();
  showToast(paid ? `${e.descricao} marcado como pago.` : `${e.descricao} voltou para a pagar.`, {
    action: { label: 'Desfazer', onClick: () => { updateExpense(id, before); rerenderAfterChange(); } },
  });
}
function rerenderAfterChange() {
  if (state.ui.tab === 'lancamentos') { const r = document.getElementById('results'); if (r) { r.innerHTML = renderLancResults(); return; } }
  rerenderView();
}

function deleteWithUndo(kind, id, fromDrawer) {
  const listName = kind === 'expense' ? 'expenses' : kind === 'income' ? 'incomes' : 'investments';
  const idx = state[listName].findIndex(x => x.id === id);
  if (idx < 0) return;
  const item = state[listName][idx];
  const saveKey = listName;
  if (kind === 'investment' && !confirm(`Excluir "${item.descricao || item.tipo}" e todas as movimentações?`)) return;
  state[listName].splice(idx, 1);
  save(saveKey);
  if (fromDrawer) closeDrawer(true);
  render();
  const name = item.descricao || item.tipo || 'Item';
  showToast(`${name} excluído.`, {
    action: { label: 'Desfazer', onClick: () => { state[listName].splice(Math.min(idx, state[listName].length), 0, item); save(saveKey); render(); } },
    duration: 7000,
  });
}

function handleAction(action, el) {
  const ui = state.ui;
  switch (action) {
    case 'close-drawer': closeDrawer(); break;
    case 'toggle-quick': {
      const m = document.getElementById('quick-menu');
      m.hidden = !m.hidden;
      el.setAttribute('aria-expanded', String(!m.hidden));
      break;
    }
    case 'quick-gasto': case 'open-expense-modal': closeQuickMenu(); openExpenseDrawer(); break;
    case 'quick-ganho': case 'open-income-modal': closeQuickMenu(); openIncomeDrawer(); break;
    case 'quick-invest': case 'open-investment-modal': closeQuickMenu(); openInvestmentDrawer(); break;
    case 'edit-expense': { const e = findById('expenses', el.dataset.id); if (e) openExpenseDrawer(e); break; }
    case 'edit-income': { const e = findById('incomes', el.dataset.id); if (e) openIncomeDrawer(e); break; }
    case 'edit-investment': { const e = findById('investments', el.dataset.id); if (e) openInvestmentDrawer(e); break; }
    case 'delete-expense': deleteWithUndo('expense', el.dataset.id, !!el.dataset.fromDrawer); break;
    case 'delete-income': deleteWithUndo('income', el.dataset.id, !!el.dataset.fromDrawer); break;
    case 'delete-investment': deleteWithUndo('investment', el.dataset.id, !!el.dataset.fromDrawer); break;
    case 'add-movimentacao': openMovDrawer(el.dataset.id, el.dataset.tipo); break;
    case 'delete-movimentacao': {
      const inv = findById('investments', el.dataset.invid);
      const mov = inv && (inv.movimentacoes || []).find(m => m.id === el.dataset.movid);
      if (!mov) break;
      removeMovimentacao(el.dataset.invid, el.dataset.movid);
      render();
      showToast('Movimentação excluída.', { action: { label: 'Desfazer', onClick: () => { addMovimentacao(inv.id, mov); render(); } }, duration: 7000 });
      break;
    }
    case 'mark-paid': markPaid(el.dataset.id, true); break;
    case 'toggle-paid': { const e = findById('expenses', el.dataset.id); if (e) markPaid(e.id, !isPaid(e)); break; }
    case 'goto-pending': ui.tab = 'lancamentos'; ui.lancamentosFilter.status = 'apagar'; render(); break;
    case 'clear-filters': ui.lancamentosFilter = { categoria: '', status: '', busca: '', tipo: '' }; rerenderView(); break;
    case 'more-lanc': ui.lancLimit += 100; rerenderAfterChange(); break;
    case 'period-prev': shiftPeriod(-1); break;
    case 'period-next': shiftPeriod(1); break;
    case 'toggle-table': {
      const id = el.dataset.chart;
      ui.tableViews[id] = !ui.tableViews[id];
      rerenderView();
      break;
    }
    case 'budget-prev': ui.orcamentoMonth = shiftMonthKey(ui.orcamentoMonth, -1); render(); break;
    case 'budget-next': ui.orcamentoMonth = shiftMonthKey(ui.orcamentoMonth, 1); render(); break;
    case 'copy-budget-prev': {
      const mk = ui.orcamentoMonth, prev = shiftMonthKey(mk, -1);
      let count = 0;
      state.budgets.filter(b => b.mes === prev).forEach(b => {
        if (!state.budgets.some(x => x.mes === mk && x.categoria === b.categoria)) { state.budgets.push({ id: uid(), mes: mk, categoria: b.categoria, valor: b.valor }); count++; }
      });
      if (count) save('budgets');
      rerenderView();
      showToast(count ? `${count} ${count === 1 ? 'orçamento copiado' : 'orçamentos copiados'}.` : 'Nada novo para copiar do mês anterior.');
      break;
    }
    case 'add-cat': {
      const input = document.getElementById(el.dataset.input);
      const v = input ? input.value.trim() : '';
      if (!v) { if (input) input.focus(); break; }
      if (addCategoria(el.dataset.list, v)) { rerenderView(); showToast(`"${v}" adicionado.`); }
      else showToast('Esse nome já existe.');
      break;
    }
    case 'remove-cat': {
      const { list, value } = el.dataset;
      removeCategoria(list, value);
      rerenderView();
      showToast(`"${value}" removido.`, { action: { label: 'Desfazer', onClick: () => { addCategoria(list, value); rerenderView(); } } });
      break;
    }
    case 'set-theme': setTheme(el.dataset.value); render(); break;
    case 'toggle-theme': setTheme(isDarkNow() ? 'light' : 'dark'); render(); break;
    case 'export-json': exportData(); break;
    case 'logout': doLogout(); break;
  }
}

function bindEvents() {
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    if (!t.closest('.quick')) closeQuickMenu();
    const act = t.closest('[data-action]');
    if (act) { if (act.tagName === 'A') ev.preventDefault(); handleAction(act.dataset.action, act); return; }
    const tab = t.closest('[data-tab]');
    if (tab) { state.ui.tab = tab.dataset.tab; state.ui.lancLimit = 100; render(); window.scrollTo(0, 0); return; }
    const rm = t.closest('[data-range-mode]');
    if (rm) { state.ui.rangeMode = rm.dataset.rangeMode; state.ui.lancLimit = 100; render(); return; }
    const sm = t.closest('[data-select-month]');
    if (sm) { state.ui.selectedMonth = sm.dataset.selectMonth; state.ui.rangeMode = 'month'; state.ui.lancLimit = 100; render(); return; }
    const bk = t.closest('[data-breakdown]');
    if (bk) { state.ui.breakdownBy = bk.dataset.breakdown; rerenderView(); return; }
    const fs = t.closest('[data-filter-status]');
    if (fs) { state.ui.lancamentosFilter.status = fs.dataset.filterStatus; rerenderView(); return; }
  });

  document.addEventListener('submit', (ev) => {
    const f = ev.target;
    if (f.id === 'expense-form') { ev.preventDefault(); submitExpense(f); }
    else if (f.id === 'income-form') { ev.preventDefault(); submitIncome(f); }
    else if (f.id === 'investment-form') { ev.preventDefault(); submitInvestment(f); }
    else if (f.id === 'mov-form') { ev.preventDefault(); submitMov(f); }
  });

  const searchDebounced = debounce((id, val) => {
    if (id === 'lanc-busca') state.ui.lancamentosFilter.busca = val; else state.ui.ganhosFilter.busca = val;
    const r = document.getElementById('results');
    if (r) r.innerHTML = id === 'lanc-busca' ? renderLancResults() : renderGanhosResults();
  }, 160);
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'lanc-busca' || t.id === 'ganho-busca') searchDebounced(t.id, t.value);
    else if (t.closest && t.closest('#expense-form')) syncExpenseForm();
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target, ui = state.ui;
    if (t.id === 'lanc-categoria') { ui.lancamentosFilter.categoria = t.value; rerenderAfterChange(); }
    else if (t.id === 'lanc-tipo') { ui.lancamentosFilter.tipo = t.value; rerenderAfterChange(); }
    else if (t.id === 'range-start' || t.id === 'range-end') {
      if (t.id === 'range-start') ui.rangeStart = t.value || ui.rangeStart; else ui.rangeEnd = t.value || ui.rangeEnd;
      if (ui.rangeStart > ui.rangeEnd) { if (t.id === 'range-start') ui.rangeEnd = ui.rangeStart; else ui.rangeStart = ui.rangeEnd; }
      render();
    }
    else if (t.classList && t.classList.contains('budget-input')) {
      upsertBudget(ui.orcamentoMonth, t.dataset.cat, parseNumberInput(t.value));
      rerenderView();
    }
    else if (t.id === 'import-file') importData(ev);
    else if (t.closest && t.closest('#expense-form')) syncExpenseForm();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (document.querySelector('#overlay-root .drawer')) closeDrawer();
      else closeQuickMenu();
    }
    if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('budget-input')) ev.target.blur();
    if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.add-row input')) {
      ev.preventDefault();
      const b = ev.target.parentElement.querySelector('[data-action="add-cat"]');
      if (b) b.click();
    }
  });
  const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (state.ui.theme === 'auto' && state.loaded) render(); });
}

applyTheme();
bindEvents();
startApp();


</script>
</body>
</html>
